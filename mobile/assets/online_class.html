<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>کلاس مجازی فراهوش</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#101827;color:#fff}button{border:0;border-radius:10px;padding:10px 12px;background:#244d82;color:#fff;font-weight:700}button.active{background:#16804a}header{padding:10px;background:#162238;display:flex;gap:8px;align-items:center;flex-wrap:wrap}header h2{margin:0;font-size:17px;flex:1}.toolbar{display:flex;gap:6px;flex-wrap:wrap}.layout{display:grid;grid-template-columns:1fr 300px;height:calc(100vh - 62px)}.main{min-width:0;display:flex;flex-direction:column}.videos{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px;padding:8px;overflow:auto;max-height:45%}.tile{position:relative;background:#050a12;border-radius:10px;min-height:130px;overflow:hidden}.tile video{width:100%;height:100%;object-fit:cover}.tile span{position:absolute;right:7px;bottom:7px;background:#000b;padding:4px 7px;border-radius:6px;font-size:12px}.boardwrap{flex:1;min-height:250px;padding:8px;display:flex;flex-direction:column}.boardbar{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:5px}.board{background:#fff;border-radius:10px;width:100%;height:100%;touch-action:none}.side{background:#162238;border-right:1px solid #2d3b52;display:flex;flex-direction:column;min-width:0}.side h3{margin:10px}.participants{padding:0 10px;max-height:35%;overflow:auto}.person{padding:7px;border-bottom:1px solid #29374c}.chat{flex:1;display:flex;flex-direction:column;min-height:0}.msgs{flex:1;overflow:auto;padding:8px}.msg{background:#20304a;border-radius:8px;padding:7px;margin-bottom:6px}.send{display:flex;gap:5px;padding:7px}.send input{flex:1;border-radius:8px;border:0;padding:10px;direction:rtl}.status{font-size:11px;opacity:.8}.danger{background:#9e2831}.secondary{background:#56647a}@media(max-width:800px){.layout{grid-template-columns:1fr}.side{display:none}.videos{max-height:35%}}
</style></head>
<body>
<header><h2>کلاس مجازی فراهوش <span id="className"></span></h2>
<div class="toolbar">
<button id="mic">🎙 میکروفون</button><button id="cam">📷 دوربین</button><button id="screen">🖥 اشتراک صفحه</button><button id="leave" class="danger">خروج</button>
</div></header>
<div class="layout"><main class="main">
<div id="videos" class="videos"></div>
<div class="boardwrap"><div class="boardbar">
<button data-tool="pen">✏️ قلم</button><button data-tool="eraser">🧽 پاک‌کن</button><button data-tool="line">／ خط</button><button data-tool="rect">▭ مستطیل</button><button data-tool="circle">○ دایره</button>
<button id="prev">صفحه قبلی</button><button id="next">صفحه بعدی</button><button id="clear" class="danger">پاک‌کردن صفحه</button><span class="status" id="page"></span>
</div><canvas id="board" class="board"></canvas></div></main>
<aside class="side"><h3>اعضای کلاس</h3><div id="participants" class="participants"></div><div class="chat"><h3>گفت‌وگوی کلاس</h3><div id="msgs" class="msgs"></div><div class="send"><input id="chatInput" placeholder="پیام..."><button id="send">ارسال</button></div></div></aside></div>
<script>
const C=__CONFIG__;
const headers={"apikey":C.anon,"Authorization":"Bearer "+C.token,"Content-Type":"application/json","Prefer":"return=minimal"};
let lastId=0, peers=new Map(), names=new Map(), localStream=null, screenStream=null, mic=true, cam=true, tool="pen", drawing=false, start=null, points=[], pageNo=1, canvas,ctx;
const $=id=>document.getElementById(id);
$("className").textContent="— "+C.classId;
function api(path,opts={}){return fetch(C.url+"/rest/v1/"+path,Object.assign({headers},opts))}
async function send(type,payload={},to=null){await api("online_class_signals",{method:"POST",body:JSON.stringify({class_id:C.classId,sender_user_id:C.userId,receiver_user_id:to,signal_type:type,payload})})}
function esc(s){return String(s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]))}
function addVideo(id,name,stream){let tile=document.getElementById("v-"+id);if(!tile){tile=document.createElement("div");tile.className="tile";tile.id="v-"+id;tile.innerHTML='<video autoplay playsinline></video><span>'+esc(name)+'</span>';$("videos").appendChild(tile)}tile.querySelector("video").srcObject=stream}
function removeVideo(id){let t=document.getElementById("v-"+id);if(t)t.remove()}
function renderPeople(){let h="";for(const [id,n] of names)h+='<div class="person">👤 '+esc(n)+(id===C.userId?" (شما)":"")+'</div>';$("participants").innerHTML=h}
async function ensureMedia(){if(localStream)return;try{localStream=await navigator.mediaDevices.getUserMedia({video:true,audio:true});addVideo(C.userId,C.name,localStream);renderPeople()}catch(e){$("status")?.remove();alert("دسترسی دوربین/میکروفون داده نشد؛ کلاس بدون تصویر/صدا ادامه می‌یابد.")}}
async function makePeer(id,name){if(peers.has(id))return peers.get(id);const pc=new RTCPeerConnection({iceServers:[{urls:"stun:stun.l.google.com:19302"}]});peers.set(id,pc);names.set(id,name||"کاربر");renderPeople();if(localStream)localStream.getTracks().forEach(t=>pc.addTrack(t,localStream));pc.onicecandidate=e=>{if(e.candidate)send("candidate",{candidate:e.candidate},id)};pc.ontrack=e=>addVideo(id,names.get(id)||"کاربر",e.streams[0]);pc.onconnectionstatechange=()=>{if(["failed","closed","disconnected"].includes(pc.connectionState)){removeVideo(id);}};return pc}
async function offerTo(id,name){const pc=await makePeer(id,name);const o=await pc.createOffer();await pc.setLocalDescription(o);await send("offer",{sdp:pc.localDescription},id)}
async function poll(){try{const q="class_id=eq."+C.classId+"&id=gt."+lastId+"&order=id.asc&limit=200";const r=await api("online_class_signals?"+q);const rows=await r.json();for(const x of rows){lastId=Math.max(lastId,Number(x.id));if(x.sender_user_id===C.userId)continue;if(x.receiver_user_id&&x.receiver_user_id!==C.userId)continue;const p=x.payload||{};if(x.signal_type==="join"){names.set(x.sender_user_id,p.name||"کاربر");renderPeople();if(C.userId<x.sender_user_id)await offerTo(x.sender_user_id,p.name)}else if(x.signal_type==="leave"){peers.get(x.sender_user_id)?.close();peers.delete(x.sender_user_id);names.delete(x.sender_user_id);removeVideo(x.sender_user_id);renderPeople()}else if(x.signal_type==="offer"){names.set(x.sender_user_id,p.name||"کاربر");renderPeople();const pc=await makePeer(x.sender_user_id,p.name);await pc.setRemoteDescription(p.sdp);const a=await pc.createAnswer();await pc.setLocalDescription(a);await send("answer",{sdp:pc.localDescription},x.sender_user_id)}else if(x.signal_type==="answer"){const pc=peers.get(x.sender_user_id);if(pc)await pc.setRemoteDescription(p.sdp)}else if(x.signal_type==="candidate"){const pc=peers.get(x.sender_user_id);if(pc&&p.candidate)try{await pc.addIceCandidate(p.candidate)}catch(e){}}else if(x.signal_type==="chat"){appendMsg(p.name||"کاربر",p.text||"")}else if(x.signal_type==="board"){applyBoard(p)}}}catch(e){console.log(e)}}
function appendMsg(n,t){let d=document.createElement("div");d.className="msg";d.innerHTML="<b>"+esc(n)+"</b><br>"+esc(t);$("msgs").appendChild(d);$("msgs").scrollTop=$("msgs").scrollHeight}
$("send").onclick=async()=>{let t=$("chatInput").value.trim();if(!t)return;appendMsg(C.name,t);$("chatInput").value="";await send("chat",{name:C.name,text:t})};
$("mic").onclick=()=>{mic=!mic;(localStream?.getAudioTracks()||[]).forEach(t=>t.enabled=mic);$("mic").classList.toggle("active",mic)};
$("cam").onclick=()=>{cam=!cam;(localStream?.getVideoTracks()||[]).forEach(t=>t.enabled=cam);$("cam").classList.toggle("active",cam)};
$("screen").onclick=async()=>{try{screenStream=await navigator.mediaDevices.getDisplayMedia({video:true});for(const [id,pc] of peers){const s=screenStream.getVideoTracks()[0];const sender=pc.getSenders().find(x=>x.track?.kind==="video");if(sender)sender.replaceTrack(s)}s?.addEventListener("ended",()=>{});}catch(e){}};
$("leave").onclick=()=>{send("leave",{name:C.name});localStream?.getTracks().forEach(t=>t.stop());peers.forEach(p=>p.close());location.href="about:blank"};
function resize(){let r=$("board").getBoundingClientRect(),d=window.devicePixelRatio||1;canvas.width=r.width*d;canvas.height=r.height*d;ctx.setTransform(d,0,0,d,0,0)}
function pos(e){let r=canvas.getBoundingClientRect(),p=e.touches?e.touches[0]:e;return [p.clientX-r.left,p.clientY-r.top]}
function drawShape(a){ctx.strokeStyle="#0b1f3a";ctx.lineWidth=2;ctx.beginPath();if(a.tool==="line"){ctx.moveTo(a.x1,a.y1);ctx.lineTo(a.x2,a.y2)}else if(a.tool==="rect"){ctx.rect(Math.min(a.x1,a.x2),Math.min(a.y1,a.y2),Math.abs(a.x2-a.x1),Math.abs(a.y2-a.y1))}else{let x=Math.min(a.x1,a.x2),y=Math.min(a.y1,a.y2),w=Math.abs(a.x2-a.x1),h=Math.abs(a.y2-a.y1);ctx.ellipse(x+w/2,y+h/2,w/2,h/2,0,0,Math.PI*2)}ctx.stroke()}
function redraw(){ctx.clearRect(0,0,canvas.width,canvas.height);loadBoard()}
async function loadBoard(){try{let r=await api("smart_board_whiteboards?class_id=eq."+C.classId+"&page_no=eq."+pageNo+"&order=id.asc&limit=1000");let rows=await r.json();for(const row of rows){try{let p=JSON.parse(row.payload||"{}");applyBoard(p,false)}catch(e){}}}catch(e){}$("page").textContent="صفحه "+pageNo}
function applyBoard(p,broadcast=true){if(Number(p.page||pageNo)!==pageNo)return;if(p.kind==="clear"){ctx.clearRect(0,0,canvas.width,canvas.height);return}if(p.tool==="pen"||p.tool==="eraser"){ctx.strokeStyle=p.tool==="eraser"?"#fff":"#0b1f3a";ctx.lineWidth=p.tool==="eraser"?14:2.5;ctx.lineCap="round";ctx.beginPath();let a=p.points||[];for(let i=0;i<a.length;i+=2)i?ctx.lineTo(a[i],a[i+1]):ctx.moveTo(a[i],a[i+1]);ctx.stroke()}else drawShape(p)}
async function saveBoard(p){p.page=pageNo;await api("smart_board_whiteboards",{method:"POST",body:JSON.stringify({class_id:C.classId,page_no:pageNo,tool:p.tool||"board",payload:JSON.stringify(p),shared:true,title:"صفحه "+pageNo,content:""})});await send("board",p)}
canvas=$("board");ctx=canvas.getContext("2d");window.addEventListener("resize",resize);resize();
canvas.addEventListener("pointerdown",e=>{drawing=true;start=pos(e);points=[...start];if(tool==="pen"||tool==="eraser"){ctx.beginPath();ctx.moveTo(...start)}});
canvas.addEventListener("pointermove",e=>{if(!drawing)return;let p=pos(e);if(tool==="pen"||tool==="eraser"){points.push(...p);ctx.strokeStyle=tool==="eraser"?"#fff":"#0b1f3a";ctx.lineWidth=tool==="eraser"?14:2.5;ctx.lineTo(...p);ctx.stroke()}});
canvas.addEventListener("pointerup",async e=>{if(!drawing)return;drawing=false;let end=pos(e);let p;if(tool==="pen"||tool==="eraser")p={tool,points};else p={tool,x1:start[0],y1:start[1],x2:end[0],y2:end[1]};await saveBoard(p)});
document.querySelectorAll("[data-tool]").forEach(b=>b.onclick=()=>{tool=b.dataset.tool;document.querySelectorAll("[data-tool]").forEach(x=>x.classList.remove("active"));b.classList.add("active")});
$("prev").onclick=()=>{pageNo=Math.max(1,pageNo-1);redraw()};$("next").onclick=()=>{pageNo++;redraw()};$("clear").onclick=async()=>{await api("smart_board_whiteboards?class_id=eq."+C.classId+"&page_no=eq."+pageNo,{method:"DELETE"});ctx.clearRect(0,0,canvas.width,canvas.height);await send("board",{page:pageNo,kind:"clear"})};
(async()=>{names.set(C.userId,C.name);renderPeople();await ensureMedia();await send("join",{name:C.name});await loadBoard();setInterval(poll,900);poll()})();
</script></body></html>
