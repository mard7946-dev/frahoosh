<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;min-height:100%;overflow:hidden;font-family:Tahoma,Arial,sans-serif;background:#0e1726;color:#fff}body{height:100dvh;min-height:100dvh;display:flex;flex-direction:column}
button,select,input{font-family:inherit}button{border:0;border-radius:9px;padding:9px 11px;background:#244d82;color:#fff;font-weight:700}
button.active{background:#16804a}.danger{background:#9e2831}.secondary{background:#56647a}
header{flex:0 0 auto;padding:7px;background:#162238;display:flex;gap:7px;align-items:center;flex-wrap:wrap;position:relative;z-index:20}
header h2{margin:0;font-size:17px;flex:1}.toolbar,.tools{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 0;flex:1;min-height:0;height:calc(100dvh - 58px);overflow:hidden}.main{min-width:0;display:flex;flex-direction:column}
.videos{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:5px;padding:5px;height:clamp(86px,14vh,135px);max-height:14vh;overflow:auto}
.tile{position:relative;background:#050a12;border-radius:8px;height:clamp(78px,12vh,120px);min-height:78px;overflow:hidden}.tile video{width:100%;height:100%;object-fit:cover}
.tile span{position:absolute;right:6px;bottom:6px;background:#000b;padding:4px 6px;border-radius:6px;font-size:11px}
.boardwrap{flex:1;min-height:0;height:100%;padding:4px;display:flex;flex-direction:column}.boardbar{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:5px;align-items:center}
.board{background:#fff;border-radius:9px;width:100%;height:100%;min-height:0;flex:1;touch-action:none}
.side{display:none;background:#162238;border-right:1px solid #2d3b52;flex-direction:column;min-width:0;overflow:auto}.layout.drawer-open{grid-template-columns:minmax(0,1fr) minmax(260px,32vw)}.layout.drawer-open .side{display:flex}
.side h3{margin:9px}.participants{padding:0 9px;max-height:24%;overflow:auto}.person{padding:6px;border-bottom:1px solid #29374c;font-size:12px}
.panel{border-top:1px solid #2d3b52;padding:8px}.panel h3{margin:3px 0 8px;font-size:14px}
.chat{flex:1;display:flex;flex-direction:column;min-height:170px}.msgs{flex:1;overflow:auto;padding:7px}.msg{background:#20304a;border-radius:8px;padding:6px;margin-bottom:5px;font-size:12px}
.send{display:flex;gap:5px;padding:7px}.send input{flex:1;border-radius:8px;border:0;padding:9px;direction:rtl}
.status{font-size:11px;opacity:.9;min-height:18px}.row{display:flex;gap:5px;flex-wrap:wrap;align-items:center}.row input,.row select{border:0;border-radius:7px;padding:8px;min-width:90px}
.quizq,.fileitem,.attrow{background:#20304a;border-radius:8px;padding:7px;margin:5px 0;font-size:12px}.fileitem button{margin-top:4px}
.fileinput{max-width:100%}@media(max-width:800px){.layout{grid-template-columns:minmax(0,1fr)}.layout.drawer-open{grid-template-columns:minmax(0,1fr)}.layout.drawer-open .side{position:fixed;z-index:15;top:58px;right:0;bottom:0;width:min(88vw,360px);box-shadow:-18px 0 40px #0009;border-top:1px solid #d9b45b}.videos{height:68px;max-height:68px;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:3px;padding:3px}.tile{height:62px;min-height:62px}.boardwrap{height:100%;min-height:0;padding:3px}.board{min-height:0;height:100%}.side{min-height:0;border-right:0;border-top:1px solid #2d3b52}.participants{max-height:120px}.chat{min-height:170px}}

#toolDrawer{position:fixed;top:8px;right:8px;z-index:1000;width:min(94vw,440px);max-width:94vw;flex:none;order:initial;background:#0b1727;border:1px solid #d9b45b66;border-radius:12px;box-shadow:0 16px 48px #0009}#toolDrawer[open]{padding:0 8px 8px}#toolDrawerBody{background:#0b1727;border:1px solid #344c65;border-radius:10px;margin-top:5px}#toolDrawer>summary{cursor:pointer;list-style:none;text-align:right;color:#f3c65b;font-weight:bold;padding:8px 12px;border:1px solid #344c65;border-radius:10px;background:#10243a}#toolDrawer>summary::-webkit-details-marker{display:none}#toolDrawerBody{max-height:58vh;overflow:auto;padding:7px 2px}#toolDrawerBody>.toolbar{display:flex;margin:4px 0 8px}#toolDrawerBody>.boardbar{display:flex;flex-wrap:wrap}#quizToggle{background:linear-gradient(110deg,#f5cf68,#dba638);color:#09182a}#toolDrawerBody #quizPanel{margin-top:8px}
/* Approved high-contrast classroom layout: maximize the board and tuck tools into a drawer */
header{background:linear-gradient(110deg,#06101f,#0c2036 65%,#112e48);border-bottom:1px solid #d9b45b66;padding:10px 14px}header h2{color:#f3c65b}.layout{grid-template-columns:minmax(0,1fr) 265px;min-height:calc(100vh - 58px)}.main{min-height:0}.boardwrap{min-height:0;height:calc(100vh - 210px);padding:7px}.board{min-height:0;height:100%;flex:1}.boardbar{position:relative;align-items:center;background:#101f32;border:1px solid #2a4059;border-radius:12px;padding:7px;margin-bottom:7px}.tools{gap:6px}button{background:#1a3b5c;border:1px solid #37536d;color:#f5f7fb;border-radius:10px}button.active{background:#e5b94d;color:#081729}button.danger{background:#762c37}select,input{background:#081727;color:#f4f7fb;border:1px solid #344c65}.side{background:#0b1727;border-color:#2a4059}.side h3,.panel h3{color:#f0c45c}.panel{border-color:#293e56}.person,.quizq,.fileitem,.attrow,.msg{background:#13273d;color:#eaf0f8;border:1px solid #263f58}.send input{background:#071423;color:white;border:1px solid #344c65}@media(max-width:800px){.layout{grid-template-columns:1fr}.boardwrap{height:64vh;min-height:390px}.board{min-height:330px}.side{min-height:320px}}

/* Minimal layout-only regression fix: the whiteboard fills the space left by the real header height. */
html,body{height:100%;min-height:0}
body{height:100dvh;min-height:0}
.layout{flex:1 1 0;height:auto;min-height:0;grid-template-columns:minmax(0,1fr) 0;overflow:hidden}
.layout.drawer-open{grid-template-columns:minmax(0,1fr) minmax(260px,32vw)}
.boardwrap{flex:1 1 0;height:auto;min-height:0;max-height:none}
.board{flex:1 1 0;height:100%;min-height:0}
@media(max-width:800px){
 .layout,.layout.drawer-open{grid-template-columns:minmax(0,1fr);height:auto;min-height:0;flex:1 1 0}

}
/* Mobile overflow fix: keep the classroom inside the viewport and let panels scroll internally */
html,body{width:100%;max-width:100%;overflow:hidden}
body{height:100dvh;min-height:0}
header{max-width:100%;min-width:0;box-sizing:border-box}
header h2{min-width:0;overflow-wrap:anywhere}
.layout{height:calc(100dvh - 58px);min-height:0;max-height:calc(100dvh - 58px);overflow:hidden}
.main{min-width:0;min-height:0;overflow:hidden}
.boardwrap{min-width:0;min-height:0;height:auto;max-height:none;flex:1 1 auto;overflow:hidden}
.boardbar{max-width:100%;min-width:0}
.board{display:block;width:100%;max-width:100%;min-width:0;min-height:0;height:100%}
#quizPanel{max-height:30dvh;overflow:auto;flex:0 1 auto}
@media(max-width:800px){
 header{gap:5px;padding:6px;max-height:30dvh;overflow-y:auto;align-content:flex-start}
 header h2{font-size:14px;flex:1 1 130px}
 header .toolbar{flex:1 1 100%;gap:4px}
 header .toolbar button{padding:7px 8px;font-size:12px}
 #toolDrawer{position:relative;top:auto;right:auto;width:100%;max-width:100%;order:5}
 #toolDrawerBody{max-height:32dvh}
 .layout,.layout.drawer-open{height:auto;max-height:none;min-height:0;flex:1 1 0;grid-template-columns:minmax(0,1fr);overflow:hidden}
 .main{height:100%;overflow:hidden}
 .videos{flex:0 0 64px;height:64px;max-height:64px;min-height:64px;overflow-x:auto;overflow-y:hidden;grid-auto-flow:column;grid-auto-columns:minmax(90px,30vw);grid-template-columns:none}
 .tile{height:58px;min-height:58px}
 .boardwrap{height:auto;min-height:0;max-height:none;flex:1 1 0;padding:3px;overflow:hidden}
 .boardbar{flex:0 0 auto;max-height:24dvh;overflow:auto;align-content:flex-start}
 .boardbar .tools{min-width:0;max-width:100%}
 .board{height:100%;min-height:0;max-height:100%;touch-action:none}
 .side{min-height:0}
}
</style>

<body>
<header>
<button id="menuToggle" aria-label="ابزارهای کلاس" title="ابزارهای کلاس" style="font-size:22px;padding:5px 12px;background:#172b42">☰</button><button id="quizToggle" type="button">آزمونک آنلاین</button><button id="guestInvite" type="button" style="background:#d9b45b;color:#09182a">لینک ورود دانش‌آموز</button><h2>کلاس هوشمند فراهوش — <span id="className"></span></h2><strong id="classTimer" dir="ltr" style="color:#f3c65b;font-variant-numeric:tabular-nums">50:00</strong>
<div class="toolbar">
<button id="mic">میکروفون</button><button id="cam">دوربین</button><button id="screen">اشتراک صدا/تصویر صفحه</button><button id="leave" class="danger">خروج</button>
</div>
<details id="toolDrawer"><summary>ابزارهای کلاس و اشتراک‌گذاری</summary><div id="toolDrawerBody"></div></details>
</header>
<div class="layout">
<main class="main">
<div id="videos" class="videos"></div>
<div class="boardwrap" id="boardwrap">
<div class="boardbar">
<div class="tools">
<button data-tool="pen" class="active">قلم</button><button data-tool="eraser">پاک‌کن</button>
<button data-tool="line">خط</button><button data-tool="rect">مستطیل</button><button data-tool="circle">دایره</button><button data-tool="triangle">مثلث</button><button data-tool="arrow">پیکان</button>
<select id="color"><option value="#0b1f3a">مشکی</option><option value="#d62828">قرمز</option><option value="#087f5b">سبز</option><option value="#1d4ed8">آبی</option><option value="#7c3aed">بنفش</option><option value="#f59e0b">نارنجی</option></select>
<select id="size"><option value="2">۲</option><option value="4" selected>۴</option><option value="7">۷</option><option value="10">۱۰</option><option value="14">۱۴</option><option value="20">۲۰</option></select>
</div>
<div class="tools">
<button id="prev">صفحه قبل</button><button id="next">صفحه بعد</button><button id="clear" class="danger">پاک‌کردن صفحه</button><button id="clearAll" class="danger">پاک‌کردن کل تخته</button><span class="status" id="page"></span>
</div>
</div>
<canvas id="board" class="board"></canvas>
</div>
<details class="panel" id="fileManager">
<summary style="cursor:pointer;color:#f0c45c;font-weight:bold;padding:5px 0">مدیریت فایل — بارگذاری و اشتراک‌گذاری</summary>
<h3>بارگذاری فایل، ویدیو و رسانه برای اعضای کلاس</h3>
<div class="row"><input id="file" class="fileinput" type="file" accept="image/*,audio/*,video/*,.pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.txt,.csv,.zip"></div>
<div id="files"></div><video id="previewVideo" controls style="display:none;width:100%;max-height:240px;margin-top:7px;border-radius:8px"></video>
</details>
<div class="panel" id="quizPanel"><h3>کوئیز آنلاین</h3><div id="quizCreate"></div><div id="quizzes"></div></div>
</main>
<aside class="side">
<h3>لیست اعضای کلاس</h3><div id="participants" class="participants"></div>
<div class="panel" id="attendancePanel"><h3>حضور و غیاب و صحت‌سنجی</h3><div id="attendance"></div></div>
<div class="chat"><h3>گفت‌وگوی کلاس</h3><div id="msgs" class="msgs"></div><div class="send"><input id="chatInput" placeholder="پیام..."><button id="send">ارسال</button></div></div>
</aside>
</div>
<script>
const C=__CONFIG__;
async function createGuestInvite(){
  const normalizeRole=v=>String(v||"").trim().toLowerCase().replace(/ي/g,"ی").replace(/ك/g,"ک").replace(/\s+/g," ");
  const role=normalizeRole(C.role);
  const allowed=["teacher","دبیر","manager","مدیر","مدیریت","مدیر مدرسه","مدیر دبیرستان","مدیر آموزشگاه","principal","administrator","admin","school manager","school_manager","school_admin","super_admin","educational","معاون آموزشی","معاونت آموزشی"];
  if(!allowed.includes(role)){alert("ساخت لینک دعوت فقط برای دبیر یا مدیریت مجاز است.");return}
  if(!Number.isInteger(Number(C.classId))||Number(C.classId)<=0){alert("شناسه کلاس معتبر نیست؛ لینک به کلاس متصل نشد.");return}
  const button=document.getElementById("guestInvite");
  if(button)button.disabled=true;
  try{
    const response=await fetch(C.url+"/rest/v1/rpc/get_online_class_guest_invite",{method:"POST",headers:{"apikey":C.anon,"Authorization":"Bearer "+C.token,"Content-Type":"application/json"},body:JSON.stringify({p_class_id:Number(C.classId)})});
    const raw=await response.text();let result;try{result=JSON.parse(raw)}catch(_){result=raw}
    if(!response.ok)throw Error(typeof result==="string"?result:(result.message||result.details||result.hint||"ساخت لینک دعوت ناموفق بود"));
    let code=Array.isArray(result)?result[0]:result;
    if(code&&typeof code==="object")code=code.get_online_class_guest_invite||code.room_code||code.code;
    code=String(code??"").trim().replace(/^"+|"+$/g,"").toUpperCase();
    if(!code||code==="NULL"||code==="UNDEFINED")throw Error("سرور کد دعوتی برنگرداند؛ مهاجرت دعوت میهمان در Supabase را بررسی کنید.");
    const inviteUrl="https://frahoosh.ir/online-class/?code="+encodeURIComponent(code);
    const message="لینک ورود میهمان به کلاس "+C.classId+" ساخته شد و به همین کلاس متصل است. برای ارسال به میهمان کپی کنید:\n"+inviteUrl;
    if(navigator.clipboard&&navigator.clipboard.writeText){try{await navigator.clipboard.writeText(inviteUrl);alert(message)}catch(_){prompt("لینک ورود میهمان به کلاس "+C.classId+" را کپی کنید:",inviteUrl)}}else prompt("لینک ورود میهمان به کلاس "+C.classId+" را کپی کنید:",inviteUrl);
  }catch(e){alert("لینک دعوت ساخته نشد: "+(e.message||"خطای نامشخص"))}
  finally{if(button)button.disabled=false}
}
window.addEventListener("DOMContentLoaded",()=>{const b=document.getElementById("guestInvite");if(b){const role=String(C.role||"").toLowerCase();b.style.display=["teacher","دبیر","manager","مدیر","educational","معاون آموزشی"].includes(role)?"inline-block":"none";b.addEventListener("click",createGuestInvite)}});
window.addEventListener("error",e=>{try{const p=document.getElementById("page");if(p)p.textContent="خطای اجرای کلاس: "+(e.message||"JavaScript")}catch(_){}console.error("CLASSROOM_RUNTIME_ERROR",e.message,e.filename,e.lineno)});
window.addEventListener("unhandledrejection",e=>{try{const p=document.getElementById("page");if(p)p.textContent="خطا در بارگذاری امکانات کلاس"}catch(_){}console.error("CLASSROOM_PROMISE_ERROR",e.reason)});
const headers={"apikey":C.anon,"Authorization":"Bearer "+C.token,"Content-Type":"application/json"};
const $=id=>document.getElementById(id);
let lastId=0,peers=new Map(),names=new Map(),localStream=null,screenStream=null,mic=true,cam=true,pendingIceCandidates=new Map();
let tool="pen",color="#0b1f3a",size=4,drawing=false,start=null,points=[],pageNo=1;
let canvas,ctx,maxPages=Number(C.maxBoardPages||15),currentSession=null,students=[],sessionStartedAt=null;const normalizeRole=v=>String(v||"").trim().toLowerCase();const staffRoles=["teacher","دبیر","manager","مدیر","principal","معاون آموزشی","معاون اجرایی","معاون پرورشی","مشاوره","educational","educational_deputy","executive","executive_deputy","cultural","cultural_deputy","counselor"];const studentRoles=["student","دانش‌آموز","دانش آموز","guest","میهمان"];const isTeacher=()=>staffRoles.includes(normalizeRole(C.role));const isStudent=()=>studentRoles.includes(normalizeRole(C.role));
$("className").textContent=C.classId;
function api(path,opts={}){return fetch(C.url+"/rest/v1/"+path,Object.assign({headers},opts))}
function jsonHeaders(extra={}){return Object.assign({},headers,extra)}
function esc(s){return String(s??"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]))}
function setStatus(t){let e=$("page");e.textContent=t||e.textContent}
function parseSessionTimestamp(value){if(!value)return null;let s=String(value).trim();if(/^\d{4}-\d\d-\d\d \d\d:\d\d:\d\d/.test(s)){s=s.replace(" ","T").replace(/(\.\d{3})\d+/,"$1").replace(/([+-]\d\d)$/,"$1:00")}const n=Date.parse(s);return Number.isFinite(n)?n:null}
function isCurrentSessionSignal(row,payload){const current=C.sessionId??null,incoming=payload?.sessionId??payload?.session_id??null;if(current!==null&&incoming!==null&&String(current)!==String(incoming))return false;const start=parseSessionTimestamp(C.sessionStartedAt),created=parseSessionTimestamp(row?.created_at);if(start&&created&&created<start-1500)return false;return true}
async function flushIceCandidates(id,pc){const queued=pendingIceCandidates.get(String(id))||[];pendingIceCandidates.delete(String(id));for(const candidate of queued){try{await pc.addIceCandidate(candidate)}catch(e){console.warn("ICE_CANDIDATE_APPLY_FAILED",e)}}}
function queueIceCandidate(id,candidate){const key=String(id),queued=pendingIceCandidates.get(key)||[];queued.push(candidate);pendingIceCandidates.set(key,queued)}
async function send(type,payload={},to=null){try{const signalPayload={...(payload||{}),sessionId:C.sessionId??null};const r=await api("online_class_signals",{method:"POST",headers:jsonHeaders({"Prefer":"return=minimal"}),body:JSON.stringify({class_id:C.classId,sender_user_id:C.userId,receiver_user_id:to,signal_type:type,payload:signalPayload})});if(!r.ok){const detail=await r.text().catch(()=> "");console.warn("CLASSROOM_SIGNAL_REJECTED",type,r.status,detail);if(["join","offer","answer","candidate"].includes(type))setStatus("ارتباط کلاس برقرار نشد ("+r.status+"). نشست کلاس و دسترسی مدرسه را بررسی کنید.");return false}return true}catch(e){console.warn("CLASSROOM_SIGNAL_SEND_FAILED",type,e);if(["join","offer","answer","candidate"].includes(type))setStatus("ارتباط کلاس برقرار نشد؛ اتصال اینترنت را بررسی کنید.");return false}}
async function requestNegotiation(id,pc){
 if(!pc||pc.signalingState==="closed")return;
 if(String(C.userId)<String(id)){
  if(pc.signalingState!=="stable")return;
  try{const offer=await pc.createOffer();await pc.setLocalDescription(offer);await send("offer",{sdp:pc.localDescription},id)}
  catch(e){console.warn("AUDIO_RENEGOTIATION_FAILED",e)}
 }else await send("renegotiate",{},id);
}
function addVideo(id,name,stream){
 let tile=document.getElementById("v-"+id);
 if(!tile){tile=document.createElement("div");tile.className="tile";tile.id="v-"+id;tile.innerHTML='<video autoplay playsinline></video><span>'+esc(name)+'</span>';$("videos").appendChild(tile)}
 const video=tile.querySelector("video");video.autoplay=true;video.playsInline=true;
 const isLocal=String(id)===String(C.userId);video.muted=isLocal;video.srcObject=stream;
 const retryAudio=()=>{
  if(isLocal)return;
  video.muted=false;
  const p=video.play();
  if(p&&p.catch)p.catch(e=>console.warn("REMOTE_AUDIO_PLAY_RETRY_FAILED",e&&e.name));
  const prompt=tile.querySelector(".audio-playback-retry");if(prompt)prompt.remove();
 };
 const playback=video.play();
 if(playback&&playback.catch)playback.catch(e=>{
  console.warn("VIDEO_PLAY_BLOCKED",e&&e.name);
  if(!isLocal&&!tile.querySelector(".audio-playback-retry")){
   const prompt=document.createElement("button");prompt.className="audio-playback-retry";prompt.type="button";prompt.textContent="برای شنیدن صدا لمس کنید";
   prompt.style.cssText="position:absolute;z-index:5;bottom:8px;right:8px;padding:8px 10px;border:0;border-radius:8px;background:#075985;color:white;font-weight:600";
   prompt.addEventListener("click",retryAudio);tile.style.position="relative";tile.appendChild(prompt);
  }
 });
}
function removeVideo(id){let t=document.getElementById("v-"+id);if(t)t.remove()}
function renderPeople(){let h="";for(const [id,n] of names)h+='<div class="person">'+esc(n)+(id===C.userId?" (شما)":"")+"</div>";$("participants").innerHTML=h}

$("mic").onclick=async()=>{

  try{
   if(!navigator.mediaDevices?.getUserMedia)throw new Error("MEDIA_API_UNAVAILABLE");
   let tracks=localStream?.getAudioTracks?.().filter(t=>t.readyState==="live")||[];
   if(!tracks.length){
    const audioStream=await navigator.mediaDevices.getUserMedia({audio:true,video:false});
    tracks=audioStream.getAudioTracks();
    if(!tracks.length)throw new Error("NO_AUDIO_TRACK");
    if(!localStream)localStream=new MediaStream();
    tracks.forEach(t=>{t.enabled=next;localStream.addTrack(t)});
    for(const [id,pc] of peers){let added=false;for(const track of tracks){const sender=pc.getSenders().find(s=>s.track?.kind==="audio");if(sender)await sender.replaceTrack(track);else{pc.addTrack(track,localStream);added=true}}if(added)await requestNegotiation(id,pc)}
    addVideo(C.userId,C.name,localStream);names.set(C.userId,C.name);renderPeople();
   }else tracks.forEach(t=>t.enabled=next);
   mic=next;
   $("mic").classList.toggle("active",mic);
   $("mic").textContent=mic?"میکروفون روشن":"میکروفون خاموش";
  }catch(e){console.warn("MIC_START_FAILED",e);alert("میکروفون فعال نشد. مجوز میکروفون را در تنظیمات Android بررسی کنید. ("+(e.name||"خطا")+")")}
 };

function resize(){let r=canvas.getBoundingClientRect(),d=window.devicePixelRatio||1;canvas.width=Math.max(1,r.width*d);canvas.height=Math.max(1,r.height*d);ctx.setTransform(d,0,0,d,0,0);loadBoard()}
function pos(e){let r=canvas.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top]}
function drawShape(a){ctx.strokeStyle=a.color||color;ctx.lineWidth=Number(a.size||size);ctx.lineCap="round";ctx.beginPath();let x1=a.x1,y1=a.y1,x2=a.x2,y2=a.y2;
if(a.tool==="line"){ctx.moveTo(x1,y1);ctx.lineTo(x2,y2)}
else if(a.tool==="rect"){ctx.rect(Math.min(x1,x2),Math.min(y1,y2),Math.abs(x2-x1),Math.abs(y2-y1))}
else if(a.tool==="circle"){let x=Math.min(x1,x2),y=Math.min(y1,y2),w=Math.abs(x2-x1),h=Math.abs(y2-y1);ctx.ellipse(x+w/2,y+h/2,w/2,h/2,0,0,Math.PI*2)}
else if(a.tool==="triangle"){ctx.moveTo((x1+x2)/2,y1);ctx.lineTo(x1,y2);ctx.lineTo(x2,y2);ctx.closePath()}
else if(a.tool==="arrow"){ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);let ang=Math.atan2(y2-y1,x2-x1),len=14;ctx.moveTo(x2,y2);ctx.lineTo(x2-len*Math.cos(ang-Math.PI/6),y2-len*Math.sin(ang-Math.PI/6));ctx.moveTo(x2,y2);ctx.lineTo(x2-len*Math.cos(ang+Math.PI/6),y2-len*Math.sin(ang+Math.PI/6))}
ctx.stroke()}
async function loadBoard(){try{ctx.clearRect(0,0,canvas.width,canvas.height);let r=await api("smart_board_whiteboards?class_id=eq."+C.classId+"&page_no=eq."+pageNo+"&order=id.asc&limit=1000");let rows=await r.json();for(const row of rows){try{applyBoard(JSON.parse(row.payload||"{}"),false)}catch(e){}}$("page").textContent="صفحه "+pageNo+" از "+maxPages}catch(e){}}
function applyBoard(p,broadcast=true){if(Number(p.page||pageNo)!==pageNo)return;if(p.kind==="clear"){ctx.clearRect(0,0,canvas.width,canvas.height);return}if(p.tool==="pen"||p.tool==="eraser"){ctx.strokeStyle=p.tool==="eraser"?"#fff":(p.color||color);ctx.lineWidth=p.tool==="eraser"?Math.max(10,Number(p.size||size)*3):Number(p.size||size);ctx.lineCap="round";ctx.beginPath();let a=p.points||[];for(let i=0;i<a.length;i+=2)i?ctx.lineTo(a[i],a[i+1]):ctx.moveTo(a[i],a[i+1]);ctx.stroke()}else drawShape(p)}

async function loadQuizzes(){
 const box=$("quizzes");
 try{
  const r=await api("smart_board_quizzes?class_id=eq."+encodeURIComponent(C.classId)+"&is_published=eq.true&order=id.desc&limit=100");
  if(!r.ok)throw new Error(await r.text());
  const rows=await r.json(), now=Date.now(); box.innerHTML="";
  const visible=rows.filter(q=>{const x=quizParse(q),p=x.publishAt?Date.parse(x.publishAt):Date.parse(q.published_at||0),e=x.endAt?Date.parse(x.endAt):0;return (!p||p<=now)&&(!e||e>=now)});
  if(!visible.length){box.innerHTML='<p class="status">در حال حاضر آزمونک فعالی برای این کلاس وجود ندارد.</p>';return}
  for(const q of visible){
   const data=quizParse(q),d=document.createElement("div");d.className="quizq";
   const title=document.createElement("b");title.textContent=q.title||"آزمونک";d.append(title);
   if(data.endAt){const t=document.createElement("p");t.textContent="پایان پاسخ‌گویی: "+new Date(data.endAt).toLocaleString();d.append(t)}

      if(item.type==="mcq"){(item.options||[]).forEach((opt,j)=>{const label=document.createElement("label");label.style.display="block";const input=document.createElement("input");input.type="radio";input.name="qa_"+q.id+"_"+i;input.value=String(j);label.append(input,document.createTextNode(" "+opt));group.append(label)})}
      else if(item.type==="tf"){["صحیح","غلط"].forEach(opt=>{const label=document.createElement("label");label.style.display="inline-flex";label.style.margin="6px";const input=document.createElement("input");input.type="radio";input.name="qa_"+q.id+"_"+i;input.value=opt;label.append(input,document.createTextNode(" "+opt));group.append(label)})}

      form.append(group);
    });
    const submit=document.createElement("button");submit.textContent="ثبت پاسخ آزمونک";submit.onclick=async()=>{const answers=[];for(let i=0;i<data.questions.length;i++){const item=data.questions[i];let val;if(item.type==="short"||item.type==="blank")val=form.querySelector('textarea[data-answer-index="'+i+'"]')?.value.trim()||"";else val=form.querySelector('input[name="qa_'+q.id+"_"+i+'"]:checked')?.value||"";if(!val){alert("لطفاً به همه سؤال‌ها پاسخ دهید.");return}answers.push({index:i+1,type:item.type,answer:val})}await answerQuiz(q,answers)};form.append(submit);d.append(form);
   }else{
    const state=document.createElement("div");state.className="status";state.textContent="تعداد سؤال‌ها: "+data.questions.length+" — مرتبط با همین کلاس";d.append(state);
   }
   box.append(d);
  }
 }catch(e){console.error("Could not load classroom quizzes",e);box.innerHTML='<p class="status">بارگذاری آزمون‌ها ناموفق بود: '+esc(e.message||"خطای سرور")+'</p>'}

let endingSession=false,evidenceEnded=false,missingSessionPolls=0;async function cleanupClassFiles(){try{const q=await api("smart_board_files?class_id=eq."+encodeURIComponent(C.classId)+"&select=id,file_path");if(!q.ok)return;const rows=await q.json();for(const f of rows){if(!f.file_path)continue;try{await fetch(C.url+"/storage/v1/object/online-class-files/"+f.file_path,{method:"DELETE",headers:{"apikey":C.anon,"Authorization":"Bearer "+C.token}})}catch(e){}}await api("smart_board_files?class_id=eq."+encodeURIComponent(C.classId),{method:"DELETE",headers:jsonHeaders({"Prefer":"return=minimal"})});$("files").innerHTML="";}catch(e){console.warn("Class file cleanup failed",e)}}async function endClassSession(){if(endingSession||!currentSession)return;endingSession=true;try{await api("online_class_sessions?id=eq."+encodeURIComponent(currentSession),{method:"PATCH",headers:jsonHeaders({"Prefer":"return=minimal"}),body:JSON.stringify({ended_at:new Date().toISOString()})});await cleanupClassFiles();setStatus("زمان کلاس پایان یافت؛ فایل‌های کلاس پاک شدند.");}catch(e){console.error("Could not end class session",e)}finally{endingSession=false}}function updateClassTimer(){if(evidenceEnded)return;const e=$("classTimer");if(!e)return;if(!sessionStartedAt){e.textContent="در انتظار شروع دبیر";return}const left=Math.max(0,Math.max(5,Math.min(240,Number(C.durationMinutes)||50))*60-Math.floor((Date.now()-sessionStartedAt)/1000));e.textContent=String(Math.floor(left/60)).padStart(2,"0")+":"+String(left%60).padStart(2,"0");if(left===0){e.style.color="#ff7373";if(!endingSession)endClassSession()}}
function sessionTimestamp(row){if(!row)return null;for(const key of ["started_at","session_started_at","start_time","started_on","created_at","inserted_at","created_on"]){const n=parseSessionTimestamp(row[key]);if(n)return n}return null}

async function refreshSessionTimer(){
 try{
  const r=await api("online_class_sessions?class_id=eq."+encodeURIComponent(C.classId)+"&teacher_user_id=not.is.null&ended_at=is.null&order=id.desc&limit=1");
  if(!r.ok)throw new Error("HTTP "+r.status);
  const rows=await r.json(),latest=rows[0];
  if(latest){
   if(C.sessionId&&String(latest.id)!==String(C.sessionId)){const configuredStart=parseSessionTimestamp(C.sessionStartedAt);if(configuredStart){sessionStartedAt=configuredStart;updateClassTimer();}console.warn("CLASS_SESSION_ID_MISMATCH; preserving active classroom media",{expected:C.sessionId,latest:latest.id});return;}
   currentSession=latest.id;
   missingSessionPolls=0;
   sessionStartedAt=sessionTimestamp(latest)||sessionStartedAt||parseSessionTimestamp(C.sessionStartedAt)||Date.now();
   evidenceEnded=false;
   updateClassTimer();
   return;
  }
  if(currentSession||C.sessionId){
   missingSessionPolls++;
   /* A temporarily missing/RLS-filtered session row must never tear down working audio/video. */
   if(currentSession){const configuredStart=parseSessionTimestamp(C.sessionStartedAt);if(configuredStart){sessionStartedAt=configuredStart;updateClassTimer()}return;}
  }
  currentSession=null;
  const configuredStart=parseSessionTimestamp(C.sessionStartedAt);
  if(configuredStart){sessionStartedAt=configuredStart;updateClassTimer();}
  else {sessionStartedAt=null;const e=$("classTimer");if(e)e.textContent="در انتظار شروع دبیر";}
 }catch(e){
  console.warn("CLASS_TIMER_REFRESH_ERROR",e);
  if(!sessionStartedAt)sessionStartedAt=parseSessionTimestamp(C.sessionStartedAt);
  if(sessionStartedAt)updateClassTimer();
  else{const el=$("classTimer");if(el)el.textContent="زمان‌سنج: اتصال زمان شروع برقرار نشد";}
 }}

// Apply the teacher's microphone permission to the student's real media track and existing peers.
window.setStudentToolsPermission=async function(permissions){
 const allowed=!!(permissions&&permissions.mic);
 const button=$("mic");
 if(!allowed){
  if(localStream)localStream.getAudioTracks().forEach(track=>{track.enabled=false});
  mic=false;
  if(button){button.disabled=true;button.classList.remove("active");button.textContent="میکروفون غیرفعال";button.title="برای فعال‌سازی باید دبیر مجوز بدهد"}
  return;
 }
 try{
  let tracks=localStream?.getAudioTracks?.().filter(track=>track.readyState==="live")||[];
  if(!tracks.length){
   const audio=await navigator.mediaDevices.getUserMedia({audio:true,video:false});
   tracks=audio.getAudioTracks();
   if(!tracks.length)throw new Error("NO_AUDIO_TRACK");
   if(!localStream)localStream=new MediaStream();
   tracks.forEach(track=>localStream.addTrack(track));
   for(const [id,pc] of peers){
    let added=false;
    for(const track of tracks){
     const sender=pc.getSenders().find(item=>item.track?.kind==="audio");
     if(sender)await sender.replaceTrack(track);
     else{pc.addTrack(track,localStream);added=true}
    }
    if(added)await requestNegotiation(id,pc);
   }
  }
  tracks.forEach(track=>{track.enabled=true});
  mic=true;
  if(button){button.disabled=false;button.classList.add("active");button.textContent="میکروفون روشن";button.title="میکروفون با اجازه دبیر فعال است"}
  if(localStream){addVideo(C.userId,C.name,localStream);names.set(C.userId,C.name);renderPeople()}
 }catch(error){
  console.warn("STUDENT_MIC_PERMISSION_APPLY_FAILED",error);
  if(button){button.disabled=false;button.textContent="فعال‌سازی میکروفون";button.title="برای تلاش دوباره لمس کنید"}
  setStatus("مجوز میکروفون ثبت شد، اما فعال‌سازی صدا انجام نشد؛ مجوز میکروفون دستگاه را بررسی کنید.");
 }
};
async function startClass(){const drawer=$("toolDrawer"),body=$("toolDrawerBody"),layout=document.querySelector(".layout");const teacher=isTeacher();if(!teacher){const b=$("board");if(b){b.style.touchAction="pan-y";b.style.pointerEvents="none";b.setAttribute("aria-label","تخته فقط برای مشاهده؛ منتظر مجوز دبیر باشید")}}document.querySelectorAll("[data-tool],#color,#size,#prev,#next,#clear,#clearAll,#fileManager,#quizPanel,#quizToggle,#screen").forEach(el=>{if(el)el.style.display=teacher?"":"none"});if(!teacher){drawer.style.display="none";document.querySelector(".boardbar").style.display="none";$("mic").style.display="";$("cam").style.display="";}for(const el of [document.querySelector("header .toolbar"),document.querySelector(".boardbar"),$("fileManager"),$("quizPanel")])if(el&&body)body.appendChild(el);const mt=$("menuToggle");if(mt)mt.onclick=()=>{if(teacher){drawer.open=!drawer.open;layout.classList.toggle("drawer-open",drawer.open)}else{layout.classList.toggle("drawer-open");}};const qt=$("quizToggle");if(qt)qt.onclick=()=>{drawer.open=true;$("quizPanel").scrollIntoView({behavior:"smooth",block:"start"});$("qt")?.focus()};setInterval(updateClassTimer,1000);refreshSessionTimer();setInterval(refreshSessionTimer,10000);buildQuizCreate();loadFiles();loadQuizzes();loadQuizResults();loadAttendance();resize();await refreshSessionTimer();if(isStudent()){const ready=await waitForTeacherSession();if(!ready)return;}if(!isStudent()&&!isTeacher()&&!currentSession){setStatus("نشست فعال دبیر در سرور پیدا نشد؛ برای جلوگیری از اجرای نمایشی، ابزارهای کلاس شروع نشدند. ابتدا دبیر باید وارد شود و کلاس را آغاز کند.");for(const id of ["mic","cam","screen","guestInvite","quizToggle","menuToggle"]){const el=$(id);if(el)el.disabled=true;}return;}if(await enforceStudentBlock())return;await ensureMedia();await autoMarkEntry();await send("join",{name:C.name,role:C.role});poll();setInterval(poll,900);setInterval(loadAttendance,7000);setInterval(loadFiles,15000);setInterval(loadQuizzes,12000);setInterval(loadQuizResults,12000)}startClass().catch(error=>{console.error('FRAHOOSH_CLASS_START_FAILED',error);const status=document.getElementById('page');if(status)status.textContent='راه‌اندازی کلاس کامل نشد: '+(error&&error.message?error.message:'خطای نامشخص')+'؛ اتصال اینترنت و مجوزهای کلاس را بررسی کنید.';});
