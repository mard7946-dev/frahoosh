<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0e1726">
<title>کلاس آنلاین فراهوش</title>
</head>
<body style="margin:0;background:#0e1726">
<div id="x" style="color:#fff;text-align:center;padding:40px;font-family:Tahoma,Arial,sans-serif">در حال آماده‌سازی کلاس...</div>
<script>
(()=>{"use strict";
const box=document.getElementById("x");
const show=(m)=>{if(box)box.innerHTML=m+"<br><a style=\"display:inline-block;margin-top:18px;padding:12px 18px;background:#155eef;color:#fff;border-radius:10px;text-decoration:none\" href=\"index.html\">بازگشت به ورود کلاس</a>";};
const timeout=8000;
async function getText(path,label){
 const c=new AbortController(); const t=setTimeout(()=>c.abort(),timeout);
 try{
  const u=new URL(path,location.href); u.searchParams.set("_v",Date.now());
  const r=await fetch(u.href,{cache:"no-store",signal:c.signal});
  if(!r.ok) throw new Error(label+" ("+r.status+")");
  return await r.text();
 }catch(e){
  if(e&&e.name==="AbortError") throw new Error(label+" — زمان پاسخ تمام شد.");
  throw e;
 }finally{clearTimeout(t);}
}
async function start(){
 let config=null;
 try{config=JSON.parse(sessionStorage.getItem("frahoosh_online_class_config")||"null")}catch(_){}
 if(!config){try{config=JSON.parse(localStorage.getItem("frahoosh_online_class_config")||"null")}catch(_){}}
 if(!config){show("نشست کلاس آماده نیست؛ ابتدا از صفحه ورود کلاس وارد شوید.");return;}
 if(box)box.textContent="در حال بارگذاری محیط کلاس…";
 try{
  const [html,patch]=await Promise.all([
   getText("../../mobile/assets/online_class.html","بارگذاری محیط کلاس ناموفق بود"),
   getText("../../online_class_apk/classroom_patch.js","بارگذاری کنترل‌های کلاس ناموفق بود")
  ]);
  if(!html.includes("const C=__CONFIG__;")) throw new Error("نسخه محیط کلاس با پیکربندی فعلی سازگار نیست.");
  const finalHtml=html.replace("const C=__CONFIG__;","const C="+JSON.stringify(config)+";")
    .replace("</body>","<script>"+patch+"</scr"+"ipt></body>");
  document.open();document.write(finalHtml);document.close();
 }catch(e){show("باز کردن کلاس انجام نشد: "+(e&&e.message?e.message:"خطای ناشناخته"));}
}
start();
})();
</script>
</body>
</html>
