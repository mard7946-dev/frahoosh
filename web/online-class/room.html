<!doctype html><html lang="fa" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>کلاس آنلاین</title><body style="margin:0;background:#0e1726"><div id=x style="color:#fff;text-align:center;padding:40px;font-family:Tahoma">در حال باز کردن کلاس...</div><script>let c=null;try{c=JSON.parse(sessionStorage.getItem("frahoosh_online_class_config")||"null")}catch(_){}if(!c){try{c=JSON.parse(localStorage.getItem("frahoosh_online_class_config")||"null")}catch(_){}}if(!c){document.getElementById("x").innerHTML="نشست کلاس آماده نیست؛ ابتدا از صفحه ورود، میزبان یا میهمان وارد شوید.<br><a style=\"display:inline-block;margin-top:18px;padding:12px 18px;background:#155eef;color:white;border-radius:10px;text-decoration:none\" href=\"/online-class/\">بازگشت به ورود کلاس</a>";}else Promise.all([fetch("../../mobile/assets/online_class.html").then(r=>r.text()),fetch("../../online_class_apk/classroom_patch.js").then(r=>r.text())]).then(([h,p])=>{h=h.replace("const C=__CONFIG__;","const C="+JSON.stringify(c)+";").replace("</body>","<script>"+p.replace(/<\/script>/g,"<\\/script>")+"</script></body>");document.open();document.write(h);document.close()}).catch(e=>document.getElementById("x").textContent="باز کردن کلاس انجام نشد: "+e.message);</script></body></html>
