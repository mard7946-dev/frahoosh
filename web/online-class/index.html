<!doctype html><html lang="fa" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>کلاس آنلاین فراهوش</title><style>body{font-family:Tahoma;background:linear-gradient(145deg,#061b43,#0b3761);min-height:100vh;margin:0}.box{width:min(850px,92vw);margin:30px auto;background:#fff;border-radius:22px;padding:24px;color:#162238}input{width:100%;box-sizing:border-box;padding:13px;margin:6px 0;border:1px solid #ccd8e6;border-radius:12px}button{padding:12px 18px;border:0;border-radius:10px;background:#1478c9;color:white;font-weight:bold}.class{display:flex;justify-content:space-between;border:1px solid #ddd;padding:12px;border-radius:12px;margin:8px 0}.err{color:#b42318;text-align:center}</style><div class=box><h1 style="text-align:center;color:#123e70">کلاس آنلاین اختصاصی دبیرستان سردار شهید حاجی زاده ۲</h1><section id=login><input id=id placeholder="کد ملی / نام کاربری"><input id=pw type=password placeholder="رمز عبور"><button id=go>ورود</button><div id=err class=err></div></section><section id=classes style="display:none">
<div id=who></div>
<div id=adminCreate style="display:none;margin:14px 0;padding:14px;border:1px solid #d7e1ec;border-radius:14px;background:#f7fbff">
<h3 style="margin-top:0">ساخت کلاس آنلاین</h3>
<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px">
<input id=ctitle placeholder="عنوان کلاس">
<input id=csubject placeholder="درس">
<input id=cname placeholder="نام کلاس / پایه">
<input id=cdate type=date>
<input id=ctime type=time>
<input id=cduration type=number min=1 value=60 placeholder="مدت (دقیقه)">
</div>
<button id=createClass style="margin-top:10px">ساخت کلاس</button><span id=createMsg style="margin-right:10px"></span>
</div>
<div id=list></div></section></div><script src="/runtime-config.js"></script><script>
const U=FRAHOOH_CONFIG.supabase_url,K=FRAHOOH_CONFIG.supabase_anon_key;let token="",profile={};const $=x=>document.getElementById(x);async function api(p,o={}){const r=await fetch(U+p,{...o,headers:{"apikey":K,"Authorization":"Bearer "+token,"Content-Type":"application/json"}});if(!r.ok)throw Error(await r.text());return r.json()}async function login(){try{let id=$("id").value.trim(),pw=$("pw").value,email=id;if(!id||!pw)throw Error("اطلاعات ورود را کامل کنید.");if(!id.includes("@")){const r=await fetch(U+"/rest/v1/rpc/lookup_auth_email_by_national_code",{method:"POST",headers:{"apikey":K,"Content-Type":"application/json"},body:JSON.stringify({p_national_code:id})});const x=await r.json();email=Array.isArray(x)?x[0]:x}const r=await fetch(U+"/auth/v1/token?grant_type=password",{method:"POST",headers:{"apikey":K,"Content-Type":"application/json"},body:JSON.stringify({email,password:pw})});if(!r.ok)throw Error(await r.text());token=(await r.json()).access_token;profile=(await api("/rest/v1/account_settings?email=eq."+encodeURIComponent(email)+"&limit=1"))[0]||{};load()}catch(e){$("err").textContent="ورود ناموفق: "+e.message}}async function load(){const role=String(profile.role||"student").toLowerCase(),nc=profile.national_code;let rows=[];if(role==="teacher"||role==="دبیر"){const t=await api("/rest/v1/teachers?national_code=eq."+encodeURIComponent(nc)+"&limit=1"),tid=t[0]?.id;if(tid){const m=await api("/rest/v1/online_class_teachers?teacher_id=eq."+tid+"&limit=100"),ids=m.map(x=>x.class_id);if(ids.length)rows=await api("/rest/v1/online_classes?id=in.("+ids.join(",")+")&order=id.desc")}}else if(role==="student"||role==="دانش‌آموز"){const s=await api("/rest/v1/students?national_code=eq."+encodeURIComponent(nc)+"&limit=1"),sid=s[0]?.id;if(sid){const m=await api("/rest/v1/online_class_students?student_id=eq."+sid+"&limit=100"),ids=m.map(x=>x.class_id);if(ids.length)rows=await api("/rest/v1/online_classes?id=in.("+ids.join(",")+")&order=id.desc")}}else if(role==="parent"||role==="ولی"||role==="اولیا"){const pcs=await api("/rest/v1/parent_children?parent_username=eq."+encodeURIComponent(profile.username)+"&limit=100"),ids=[];for(const pc of pcs){const m=await api("/rest/v1/online_class_students?student_id=eq."+pc.student_id+"&limit=100");m.forEach(x=>{if(!ids.includes(x.class_id))ids.push(x.class_id)})}if(ids.length)rows=await api("/rest/v1/online_classes?id=in.("+ids.join(",")+")&order=id.desc")}else if(["manager","مدیر","educational","executive","counselor","معاون آموزشی","معاون اجرایی","معاون پرورشی","مشاوره"].includes(role)){rows=await api("/rest/v1/online_classes?order=id.desc&limit=200")}$("who").textContent=(profile.display_name||profile.username||"")+" • "+role;
if(["manager","مدیر","educational","معاون آموزشی"].includes(role)){$("adminCreate").style.display="block";$("createClass").onclick=createClass;}$("list").innerHTML=rows.map(r=>'<div class=class><span><b>'+String(r.title||r.subject||"کلاس")+'</b><br>'+String(r.class_name||"")+' • '+(r.status==="active"?"فعال":"غیرفعال")+'</span><button onclick="openRoom('+r.id+')">ورود</button></div>').join("")||"<p>کلاسی پیدا نشد.</p>";$("login").style.display="none";$("classes").style.display="block"}async function createClass(){
 try{
  const p={title:$("ctitle").value.trim()||"کلاس آنلاین",subject:$("csubject").value.trim(),class_name:$("cname").value.trim(),status:"active"};
  if(!p.class_name)return $("createMsg").textContent="نام کلاس الزامی است.";
  const r=await api("/rest/v1/online_classes",{method:"POST",headers:{"Prefer":"return=representation"},body:JSON.stringify(p)});
  if(!r.ok)throw Error(await r.text());
  $("createMsg").textContent="کلاس با موفقیت ساخته شد.";
  $("ctitle").value=$("csubject").value=$("cname").value=$("cdate").value=$("ctime").value="";
  load();
 }catch(e){$("createMsg").textContent="ساخت کلاس انجام نشد: "+e.message}
}
async function openRoom(id){try{const role=String(profile.role||"student").toLowerCase();if(role==="teacher"||role==="دبیر")await api("/rest/v1/rpc/start_online_class_session",{method:"POST",body:JSON.stringify({p_class_id:Number(id)})});const s=await api("/rest/v1/online_class_sessions?class_id=eq."+id+"&ended_at=is.null&order=id.desc&limit=1");if(!s[0])throw Error("جلسه هنوز توسط دبیر شروع نشده است.");const u=await fetch(U+"/auth/v1/user",{headers:{"apikey":K,"Authorization":"Bearer "+token}}).then(r=>r.json());let sid=null,tid=null;if(role==="student"||role==="دانش‌آموز"){const a=await api("/rest/v1/students?national_code=eq."+encodeURIComponent(profile.national_code)+"&limit=1");sid=a[0]?.id}if(role==="teacher"||role==="دبیر"){const a=await api("/rest/v1/teachers?national_code=eq."+encodeURIComponent(profile.national_code)+"&limit=1");tid=a[0]?.id}sessionStorage.setItem("frahoosh_online_class_config",JSON.stringify({url:U,anon:K,token,userId:u.id,classId:+id,name:profile.display_name||profile.username||"کاربر",role,studentId:sid,teacherId:tid,maxBoardPages:15}));location.href="room.html"}catch(e){$("err").textContent=e.message}}$("go").onclick=login;$("pw").onkeydown=e=>{if(e.key==="Enter")login()};</script>
