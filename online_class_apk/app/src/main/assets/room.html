<!doctype html>
<html lang="fa" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>کلاس آنلاین</title></head>
<body style="margin:0;background:#0e1726">
<div id="x" style="color:#fff;text-align:center;padding:40px;font-family:Tahoma">در حال باز کردن کلاس...</div>
<script>
(function(){
  var status=document.getElementById("x");
  function fail(e){
    var msg=e&&e.message?e.message:String(e||"خطای نامشخص");
    status.style.cssText="color:#fff;background:#7f1d1d;padding:24px;text-align:center;font:16px/2 Tahoma;direction:rtl";
    status.textContent="کلاس بارگذاری نشد: "+msg;
    console.error("Frahoosh room bootstrap failed",e);
  }
  function readConfig(){
    var c=null;
    try{c=JSON.parse(sessionStorage.getItem("frahoosh_online_class_config")||"null")}catch(e){}
    if(!c)try{c=JSON.parse(localStorage.getItem("frahoosh_online_class_config")||"null")}catch(e){}
    return c;
  }
  var c=readConfig();
  if(!c){
    status.innerHTML="نشست کلاس آماده نیست؛ ابتدا از صفحه ورود، میزبان یا میهمان وارد شوید.<br><a style='display:inline-block;margin-top:18px;padding:12px 18px;background:#155eef;color:white;border-radius:10px;text-decoration:none' href='/online-class/'>بازگشت به ورود کلاس</a>";
    return;
  }
  status.textContent="در حال بارگذاری محیط کلاس…";
  Promise.all([
    fetch("/online-class/online_class.html",{cache:"no-store"}).then(function(r){if(!r.ok)throw Error("بارگذاری محیط کلاس ناموفق بود ("+r.status+")");return r.text()}),
    fetch("/online-class/classroom_patch.js",{cache:"no-store"}).then(function(r){if(!r.ok)throw Error("بارگذاری ابزارهای کلاس ناموفق بود ("+r.status+")");return r.text()})
  ]).then(function(parts){
    var h=parts[0], p=parts[1];
    var marker="const C=__CONFIG__;";
    if(h.indexOf(marker)<0)throw Error("نسخه محیط کلاس ناسازگار است؛ marker تنظیمات پیدا نشد.");
    h=h.replace(marker,"const C="+JSON.stringify(c)+";");
    h=h.replace("</body>","<script>"+p+"<"+"/script></body>");
    document.open();
    document.write(h);
    document.close();
  }).catch(fail);
})();
</script>
</body>
</html>
