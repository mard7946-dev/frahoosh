<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>کلاس آنلاین فراهوش</title></head>
<body style="margin:0;background:#0e1726"><div id="x" style="color:#fff;text-align:center;padding:40px;font-family:Tahoma">در حال باز کردن کلاس...</div>
<script>
let c=__INITIAL_CONFIG_JSON__;
try{if(typeof c==="string")c=JSON.parse(c)}catch(_){c=null}
if(!c){try{c=JSON.parse(sessionStorage.getItem("frahoosh_online_class_config")||"null")}catch(_){}}
if(!c){try{c=JSON.parse(localStorage.getItem("frahoosh_online_class_config")||"null")}catch(_){}}
if(!c){document.getElementById("x").innerHTML="نشست کلاس آماده نیست؛ ابتدا از صفحه ورود، میزبان یا میهمان وارد شوید.";}
else{
 try{
  let h=__BUNDLED_CLASS_HTML__;
  const p=__BUNDLED_PATCH_JS__;
  if(!h.includes("const C=__CONFIG__;"))throw Error("قالب محیط کلاس ناسازگار است");
  h=h.replace("const C=__CONFIG__;","const C="+JSON.stringify(c)+";");
  h=h.replace("</body>","<script>"+p.replace(/<\\/script/gi,"<\\\\/script")+"<"+"/script></body>");
  document.open();document.write(h);document.close();
 }catch(e){const x=document.getElementById("x");x.style.cssText="color:#fff;background:#7f1d1d;padding:24px;text-align:center;font:16px/2 Tahoma";x.textContent="کلاس بارگذاری نشد: "+(e.message||e);}
}
</script></body></html>
