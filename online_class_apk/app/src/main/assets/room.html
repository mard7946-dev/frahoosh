<!doctype html><html lang="fa" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>کلاس آنلاین</title><body style="margin:0;background:#0e1726"><div id=x style="color:#fff;text-align:center;padding:40px;font-family:Tahoma">در حال باز کردن کلاس...</div><script>const c=JSON.parse(sessionStorage.getItem("frahoosh_online_class_config")||"null");if(!c)document.getElementById("x").textContent="نشست کلاس پیدا نشد.";else Promise.all([fetch("online_class.html").then(r=>r.text()),fetch("classroom_patch.js").then(r=>r.text())]).then(([h,p])=>{h=h.replace("const C=__CONFIG__;","window.C="+JSON.stringify(c)+";const C=window.C;");const f=document.createElement("iframe");f.style.cssText="position:fixed;inset:0;width:100%;height:100%;border:0;background:#0e1726";f.allow="camera; microphone; display-capture; fullscreen";document.body.innerHTML="";document.body.appendChild(f);f.onload=()=>{try{const sc=f.contentDocument.createElement("script");sc.textContent=p;f.contentDocument.body.appendChild(sc)}catch(e){document.body.innerHTML="<div style='color:white;padding:30px;font-family:Tahoma'>خطای بارگذاری کلاس: "+e.message+"</div>"}};f.srcdoc=h}).catch(e=>document.getElementById("x").textContent="باز کردن کلاس انجام نشد: "+e.message);</script></body></html>
