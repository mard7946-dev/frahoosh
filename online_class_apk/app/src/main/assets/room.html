<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0e1726">
<title>کلاس آنلاین فراهوش</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#0e1726;color:#fff;font-family:Tahoma,Arial,sans-serif}
#x{padding:24px;text-align:center;line-height:2}
a{color:#f3c65b}
</style>
</head>
<body>
<div id="x">در حال آماده‌سازی کلاس…</div>
<script>
(()=>{"use strict";
const box=document.getElementById("x");
const entryUrl=()=>new URL("index.html",location.href).href; const show=m=>{box.style.display="block";box.innerHTML=m+'<br><a href="'+entryUrl()+'">بازگشت به ورود کلاس</a>';};
async function getText(path,label){
 const c=new AbortController(),t=setTimeout(()=>c.abort(),12000);
 try{const u=new URL(path,location.href);u.searchParams.set("_v",Date.now());const r=await fetch(u.href,{cache:"no-store",signal:c.signal});if(!r.ok)throw Error(label+" ("+r.status+")");return await r.text();}
 catch(e){if(e&&e.name==="AbortError")throw Error(label+"؛ زمان پاسخ تمام شد.");throw e;}
 finally{clearTimeout(t);}
}
async function getTextFallback(paths,label){
 let lastError=null;
 for(const path of paths){
  try{return await getText(path,label);}
  catch(error){lastError=error;if(!/\(404\)/.test(String(error&&error.message||error)))throw error;}
 }
 throw lastError||Error(label);
}
async function start(){
 let config=null;
 for(const store of [sessionStorage,localStorage]){try{config=JSON.parse(store.getItem("frahoosh_online_class_config")||"null")}catch(_){}if(config)break;}
 if(!config){show("نشست کلاس آماده نیست؛ ابتدا از صفحه ورود کلاس وارد شوید.");return;}
 if(!config.url||!config.anon||!config.token||!config.classId||!config.userId){show("اطلاعات نشست کلاس ناقص است؛ از صفحه ورود کلاس دوباره وارد شوید.");return;}
 box.textContent="در حال بارگذاری محیط کلاس…";
 try{
  const [html,patch]=await Promise.all([
   getTextFallback(["../../mobile/assets/online_class.html","/online-class/online_class.html","/mobile/assets/online_class.html"],"بارگذاری محیط کلاس ناموفق بود"),
   getTextFallback(["../../online_class_apk/classroom_patch.js","/online-class/classroom_patch.js","/online_class_apk/classroom_patch.js"],"بارگذاری ابزارهای کلاس ناموفق بود")
  ]);
  if(!html.includes("const C=__CONFIG__;"))throw Error("نسخه محیط کلاس با پیکربندی فعلی سازگار نیست.");
  config.guestInviteBase=new URL("index.html",location.href).href;
  let page=html.replace("const C=__CONFIG__;","window.C="+JSON.stringify(config)+";const C=window.C;");
  if(!page.includes("const C=window.C;"))throw Error("تنظیمات ورود کلاس جایگزین نشد.");
  const closeScript="</scr"+"ipt>";
  page=page.replace("</body>","<script>"+patch+closeScript+"</body>");
  // Keep the classroom in the top-level WebView document: camera/microphone permissions,
  // WebRTC audio playback, timer updates, and navigation then share one document context.
  document.open();document.write(page);document.close();
 }catch(e){console.error("Frahoosh room bootstrap failed",e);show("باز کردن کلاس انجام نشد: "+(e&&e.message?e.message:"خطای ناشناخته"));}
}
start();
})();
</script>
</body>
</html>
