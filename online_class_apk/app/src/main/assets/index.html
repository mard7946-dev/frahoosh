<!doctype html><html lang="fa" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>کلاس آنلاین فراهوش</title><style>body{font-family:Tahoma;background:linear-gradient(145deg,#061b43,#0b3761);min-height:100vh;margin:0}.box{width:min(850px,92vw);margin:30px auto;background:#fff;border-radius:22px;padding:24px;color:#162238}input{width:100%;box-sizing:border-box;padding:13px;margin:6px 0;border:1px solid #ccd8e6;border-radius:12px}button{padding:12px 18px;border:0;border-radius:10px;background:#1478c9;color:white;font-weight:bold}.class{display:flex;justify-content:space-between;border:1px solid #ddd;padding:12px;border-radius:12px;margin:8px 0}.err{color:#b42318;text-align:center}</style><div class=box><h1 style="text-align:center;color:#123e70">کلاس آنلاین اختصاصی دبیرستان سردار شهید حاجی زاده ۲</h1><section id=login><input id=id placeholder="کد ملی / نام کاربری"><input id=pw type=password placeholder="رمز عبور"><button id=go>ورود</button><div id=err class=err></div></section><section id=classes style="display:none">
<div id=who></div>
<div id=adminCreate style="display:none;margin:14px 0;padding:14px;border:1px solid #d7e1ec;border-radius:14px;background:#f7fbff">
<h3 style="margin-top:0">ساخت کلاس آنلاین</h3>
<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px">
<input id=ctitle placeholder="عنوان کلاس">
<input id=csubject placeholder="درس">
<input id=cname placeholder="نام کلاس / پایه">
<input id=cdate placeholder="تاریخ کلاس (۱۴۰۵/۰۷/۱۶)" inputmode="numeric">
<input id=ctime type=time>
<input id=cduration type=number min=1 value=60 placeholder="مدت (دقیقه)">
</div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px"><select id=cteacher><option value="">انتخاب دبیر</option></select><textarea id=cstudents rows=3 placeholder="کد ملی دانش‌آموزان، هر کدام در یک خط"></textarea></div>
<button id=createClass style="margin-top:10px">ساخت کلاس</button><span id=createMsg style="margin-right:10px"></span>
</div>
<div id=list></div></section></div><script>const FRAHOOH_CONFIG={supabase_url:"https://gtmmllcxhdejwjjnyzrh.supabase.co",supabase_anon_key:"sb_publishable_9gf_wPQVUTO6STGZR6JNSw_YduXkxN0",school_name:"دبیرستان سردار شهید حاجی زاده ۲",school_year:"۱۴۰۵-۱۴۰۶"};</script><script>
const U=FRAHOOH_CONFIG.supabase_url,K=FRAHOOH_CONFIG.supabase_anon_key;let token="",profile={},teachers=[],students=[];const $=x=>document.getElementById(x);async function api(p,o={}){const r=await fetch(U+p,{...o,headers:{"apikey":K,"Authorization":"Bearer "+token,"Content-Type":"application/json"}});if(!r.ok)throw Error(await r.text());return r.json()}async function login(){try{let id=$("id").value.trim(),pw=$("pw").value,email=id;if(!id||!pw)throw Error("اطلاعات ورود را کامل کنید.");if(!id.includes("@")){const r=await fetch(U+"/rest/v1/rpc/lookup_auth_email_by_national_code",{method:"POST",headers:{"apikey":K,"Content-Type":"application/json"},body:JSON.stringify({p_national_code:id})});const x=await r.json();email=Array.isArray(x)?x[0]:x}const r=await fetch(U+"/auth/v1/token?grant_type=password",{method:"POST",headers:{"apikey":K,"Content-Type":"application/json"},body:JSON.stringify({email,password:pw})});if(!r.ok)throw Error(await r.text());token=(await r.json()).access_token;profile=(await api("/rest/v1/account_settings?email=eq."+encodeURIComponent(email)+"&limit=1"))[0]||{};load()}catch(e){$("err").textContent="ورود ناموفق: "+e.message}}async function load(){const role=String(profile.role||"student").toLowerCase(),nc=profile.national_code;let rows=[];if(role==="teacher"||role==="دبیر"){const t=await api("/rest/v1/teachers?national_code=eq."+encodeURIComponent(nc)+"&limit=1"),tid=t[0]?.id;if(tid){const m=await api("/rest/v1/online_class_teachers?teacher_id=eq."+tid+"&limit=100"),ids=m.map(x=>x.class_id);if(ids.length)rows=await api("/rest/v1/online_classes?id=in.("+ids.join(",")+")&order=id.desc")}}else if(role==="student"||role==="دانش‌آموز"){const s=await api("/rest/v1/students?national_code=eq."+encodeURIComponent(nc)+"&limit=1"),sid=s[0]?.id;if(sid){const m=await api("/rest/v1/online_class_students?student_id=eq."+sid+"&limit=100"),ids=m.map(x=>x.class_id);if(ids.length)rows=await api("/rest/v1/online_classes?id=in.("+ids.join(",")+")&order=id.desc")}}else if(role==="parent"||role==="ولی"||role==="اولیا"){const pcs=await api("/rest/v1/parent_children?parent_username=eq."+encodeURIComponent(profile.username)+"&limit=100"),ids=[];for(const pc of pcs){const m=await api("/rest/v1/online_class_students?student_id=eq."+pc.student_id+"&limit=100");m.forEach(x=>{if(!ids.includes(x.class_id))ids.push(x.class_id)})}if(ids.length)rows=await api("/rest/v1/online_classes?id=in.("+ids.join(",")+")&order=id.desc")}else if(["manager","مدیر","educational","executive","counselor","معاون آموزشی","معاون اجرایی","معاون پرورشی","مشاوره"].includes(role)){rows=await api("/rest/v1/online_classes?order=id.desc&limit=200")}$("who").textContent=(profile.display_name||profile.username||"")+" • "+role;
if(["manager","مدیر","principal","administrator","admin","educational","معاون آموزشی","executive","معاون اجرایی","معاون پرورشی"].includes(role)){$("adminCreate").style.display="block";$("createClass").onclick=createClass;await loadPeople();}$("list").innerHTML=rows.map(r=>'<div class=class><span><b>'+String(r.title||r.subject||"کلاس")+'</b><br>'+String(r.class_name||"")+' • '+(r.status==="active"?"فعال":"غیرفعال")+'</span><button onclick="openRoom('+r.id+')">ورود</button></div>').join("")||"<p>کلاسی پیدا نشد.</p>";$("login").style.display="none";$("classes").style.display="block"}async function createClass(){
 try{
  const teacherId=Number($("cteacher").value||0); const p={title:$("ctitle").value.trim()||"کلاس آنلاین",subject:$("csubject").value.trim(),lesson:$("csubject").value.trim(),class_name:$("cname").value.trim(),duration:Number($("cduration").value||60),start_time:$("ctime").value||"",status:"active",created_at_shamsi:jalaliNow(),start_time_shamsi:($("cdate").value.trim()||jalaliNow())+" "+($("ctime").value||"")};
  if(!p.class_name)return $("createMsg").textContent="نام کلاس الزامی است.";
  const r=await api("/rest/v1/online_classes",{method:"POST",headers:{"Prefer":"return=representation"},body:JSON.stringify(p)});
  if(!r.ok)throw Error(await r.text());
  const created=Array.isArray(r)?r[0]:r; const classId=created?.id;
  if(teacherId&&classId){const t=teachers.find(x=>Number(x.id)===teacherId);await api("/rest/v1/online_class_teachers",{method:"POST",headers:{"Prefer":"return=minimal"},body:JSON.stringify({class_id:classId,teacher_id:teacherId,teacher_name:(t?.first_name||"")+" "+(t?.last_name||"")})});}
  if(classId){for(const nc of $("cstudents").value.split(/[\\n,]+/).map(x=>x.trim()).filter(Boolean)){const st=students.find(x=>x.national_code===nc);if(st)await api("/rest/v1/online_class_students",{method:"POST",headers:{"Prefer":"return=minimal"},body:JSON.stringify({class_id:classId,student_id:st.id,student_name:(st.first_name||"")+" "+(st.last_name||"")})});}}
  $("createMsg").textContent="کلاس ساخته شد و دبیر/دانش‌آموزان متصل شدند.";
  $("ctitle").value=$("csubject").value=$("cname").value=$("cdate").value=$("ctime").value=$("cstudents").value="";$("cteacher").value="";
  load();
 }catch(e){$("createMsg").textContent="ساخت کلاس انجام نشد: "+e.message}
}
function jalaliNow(){const d=new Date();return toJalali(d.getFullYear(),d.getMonth()+1,d.getDate())}function toJalali(gy,gm,gd){let gdm=[0,31,59,90,120,151,181,212,243,273,304,334];let gy2=gm>2?gy+1:gy;let days=355666+365*gy+Math.floor((gy2+3)/4)-Math.floor((gy2+99)/100)+Math.floor((gy2+399)/400)+gd+gdm[gm-1];let jy=-1595+33*Math.floor(days/12053);days%=12053;jy+=4*Math.floor(days/1461);days%=1461;if(days>365){jy+=Math.floor((days-1)/365);days=(days-1)%365}let jm=days<186?1+Math.floor(days/31):7+Math.floor((days-186)/30);let jd=1+(days<186?days%31:(days-186)%30);return [jy,jm,jd].map(x=>String(x).padStart(2,"0")).join("/")}async function loadPeople(){try{teachers=await api("/rest/v1/teachers?select=id,first_name,last_name,national_code&order=last_name.asc&limit=500");students=await api("/rest/v1/students?select=id,first_name,last_name,national_code&order=last_name.asc&limit=1000");$("cteacher").innerHTML='<option value="">انتخاب دبیر</option>'+teachers.map(t=>'<option value="'+t.id+'">'+String(t.first_name||"")+" "+String(t.last_name||"")+" — "+String(t.national_code||"")+"</option>").join("");}catch(e){$("createMsg").textContent="فهرست دبیران/دانش‌آموزان بارگذاری نشد: "+e.message}}async function openRoom(id){try{const role=String(profile.role||"student").toLowerCase();if(role==="teacher"||role==="دبیر"||role==="manager"||role==="مدیر"||role==="educational"||role==="معاون آموزشی")await api("/rest/v1/rpc/start_online_class_session",{method:"POST",body:JSON.stringify({p_class_id:Number(id)})});const s=await api("/rest/v1/online_class_sessions?class_id=eq."+id+"&ended_at=is.null&order=id.desc&limit=1");if(!s[0])throw Error("جلسه هنوز توسط دبیر شروع نشده است.");const u=await fetch(U+"/auth/v1/user",{headers:{"apikey":K,"Authorization":"Bearer "+token}}).then(r=>r.json());let sid=null,tid=null;if(role==="student"||role==="دانش‌آموز"){const a=await api("/rest/v1/students?national_code=eq."+encodeURIComponent(profile.national_code)+"&limit=1");sid=a[0]?.id}if(role==="teacher"||role==="دبیر"){const a=await api("/rest/v1/teachers?national_code=eq."+encodeURIComponent(profile.national_code)+"&limit=1");tid=a[0]?.id}sessionStorage.setItem("frahoosh_online_class_config",JSON.stringify({url:U,anon:K,token,userId:u.id,classId:+id,name:profile.display_name||profile.username||"کاربر",role,studentId:sid,teacherId:tid,maxBoardPages:15}));location.href="room.html"}catch(e){$("err").textContent=e.message}}$("go").onclick=login;$("pw").onkeydown=e=>{if(e.key==="Enter")login()};</script>
