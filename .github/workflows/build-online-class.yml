name: Frahoosh Standalone Online Class APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "online_class_apk/**"
      - ".github/workflows/build-online-class.yml"

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Validate Gradle project
        working-directory: online_class_apk
        run: gradle --version

      - name: Build standalone classroom APK
        working-directory: online_class_apk
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK
        run: |
          test -s online_class_apk/app/build/outputs/apk/debug/app-debug.apk
          sha256sum online_class_apk/app/build/outputs/apk/debug/app-debug.apk | tee online_class_apk/online-class-apk.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: Frahoosh-Online-Class-APK-v2.0.0
          path: |
            online_class_apk/app/build/outputs/apk/debug/app-debug.apk
            online_class_apk/online-class-apk.sha256
          retention-days: 14
