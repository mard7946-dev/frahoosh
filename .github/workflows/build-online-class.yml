name: Frahoosh Standalone Online Class APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "online_class_apk/**"
      - ".github/workflows/build-online-class.yml"

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          yes | sdkmanager --licenses >/dev/null || true

      - uses: gradle/actions/setup-gradle@v4

      - name: Validate Gradle project
        working-directory: online_class_apk
        run: gradle --version

      - name: Build standalone classroom APK
        working-directory: online_class_apk
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK
        run: |
          test -s online_class_apk/app/build/outputs/apk/debug/app-debug.apk
          sha256sum online_class_apk/app/build/outputs/apk/debug/app-debug.apk | tee online_class-apk.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: Frahoosh-Online-Class-APK-v2.0.0
          path: |
            online_class_apk/app/build/outputs/apk/debug/app-debug.apk
            online_class_apk/online_class-apk.sha256
          retention-days: 14
