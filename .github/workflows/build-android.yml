name: Frahoosh Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Frahoosh APK
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip wget curl \
            autoconf automake libtool pkg-config \
            zlib1g-dev libffi-dev libssl-dev \
            build-essential ccache

      - name: Install Buildozer toolchain
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "cython==0.29.36" "buildozer==1.5.0"
          buildozer --version

      - name: Configure preinstalled Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -d "$SDK" || { echo "Android SDK not found at $SDK"; exit 1; }
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "Using Android SDK: $SDK"
          find "$SDK" -maxdepth 5 -type f -name sdkmanager -print -quit

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          test -x "${SDKMANAGER}"
          yes | "${SDKMANAGER}" --licenses >/dev/null || true
          "${SDKMANAGER}" "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;28.2.13676358"
          test -d "${ANDROID_SDK_ROOT}/ndk/28.2.13676358"
          test -d "${ANDROID_SDK_ROOT}/platforms/android-35"
          test -d "${ANDROID_SDK_ROOT}/build-tools/35.0.0"

      - name: Configure Android environment
        shell: bash
        run: |
          set -euo pipefail
          NDK="${ANDROID_SDK_ROOT}/ndk/28.2.13676358"
          echo "ANDROID_HOME=${ANDROID_SDK_ROOT}" >> "${GITHUB_ENV}"
          echo "ANDROID_NDK_HOME=${NDK}" >> "${GITHUB_ENV}"
          echo "ANDROID_NDK_ROOT=${NDK}" >> "${GITHUB_ENV}"
          echo "PATH=${ANDROID_SDK_ROOT}/platform-tools:${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin:${PATH}" >> "${GITHUB_ENV}"
          yes | "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true

      - name: Create runtime config
        shell: bash
        env:
          FRAHOOSH_SUPABASE_URL: ${{ secrets.FRAHOOSH_SUPABASE_URL }}
          FRAHOOSH_SUPABASE_ANON_KEY: ${{ secrets.FRAHOOSH_SUPABASE_ANON_KEY }}
          FRAHOOSH_SCHOOL_ID: ${{ secrets.FRAHOOSH_SCHOOL_ID }}
          FRAHOOSH_SCHOOL_NAME: ${{ secrets.FRAHOOSH_SCHOOL_NAME }}
          FRAHOOSH_SCHOOL_YEAR: ${{ secrets.FRAHOOSH_SCHOOL_YEAR }}
          FRAHOOSH_PAYMENT_GATEWAY_URL: ${{ secrets.FRAHOOSH_PAYMENT_GATEWAY_URL }}
          FRAHOOSH_WEB_URL: ${{ secrets.FRAHOOSH_WEB_URL }}
        run: |
          set -euo pipefail
          test -n "${FRAHOOSH_SUPABASE_URL}" || { echo "Missing FRAHOOSH_SUPABASE_URL"; exit 1; }
          test -n "${FRAHOOSH_SUPABASE_ANON_KEY}" || { echo "Missing FRAHOOSH_SUPABASE_ANON_KEY"; exit 1; }
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          config = {
              "supabase_url": os.environ["FRAHOOSH_SUPABASE_URL"],
              "supabase_anon_key": os.environ["FRAHOOSH_SUPABASE_ANON_KEY"],
              "school_id": os.environ.get("FRAHOOSH_SCHOOL_ID", ""),
              "school_name": os.environ.get("FRAHOOSH_SCHOOL_NAME", "") or "دبیرستان سردارشهیدحاجی زاده ۲",
              "school_year": os.environ.get("FRAHOOSH_SCHOOL_YEAR", "") or "۱۴۰۵-۱۴۰۶",
              "payment_gateway_url": os.environ.get("FRAHOOSH_PAYMENT_GATEWAY_URL", ""),
              "web_url": os.environ.get("FRAHOOSH_WEB_URL", "") or "https://frahoosh.ir",
          }

          path = Path("mobile/runtime_config.json")
          path.write_text(json.dumps(config, ensure_ascii=False, indent=2), encoding="utf-8")
          print("Runtime configuration created:", path)
          PY
          test -s mobile/runtime_config.json
          python - <<'PY'
          import json
          from pathlib import Path
          import urllib.request

          cfg = json.loads(Path("mobile/runtime_config.json").read_text(encoding="utf-8"))
          url = cfg["supabase_url"].rstrip("/") + "/auth/v1/settings"
          req = urllib.request.Request(url, headers={"apikey": cfg["supabase_anon_key"]})
          with urllib.request.urlopen(req, timeout=15) as response:
              if response.status != 200:
                  raise SystemExit(f"Supabase auth endpoint returned HTTP {response.status}")
          print("Supabase auth endpoint connectivity check passed.")
          PY

      - name: Validate repository before Android build
        shell: bash
        run: |
          set -euo pipefail
          test -f main.py
          test -f mobile/main.py
          test -f buildozer.spec
          test -f shared/frahoosh_contract.json
          test -f shared/module_catalog.json
          python -m compileall -q mobile main.py
          python -m json.tool shared/frahoosh_contract.json >/dev/null
          python -m json.tool shared/module_catalog.json >/dev/null
          python - <<'PY'
          import json
          from pathlib import Path
          catalog = json.loads(Path("shared/module_catalog.json").read_text(encoding="utf-8"))
          panels = catalog.get("panels") or {}
          modules = catalog.get("modules") or {}
          required = {
              "weekly_schedule": "weekly_schedule",
              "report_cards": "report_cards",
              "attendance": "attendance",
              "discipline_records": "discipline",
              "finance_transactions": "finance",
              "parent_children": "parent_children",
              "smart_class_preview": "smart_class",
          }
          assert panels and modules, "Canonical module catalog is empty"
          assert len(modules) >= 100, f"Unexpected canonical module count: {len(modules)}"
          assert all(key in modules for key in required), "Special module missing from catalog"
          assert all(v == ("ثبت جدید" if k == "create" else "ویرایش" if k == "update" else "حذف") for k, v in catalog.get("operations", {}).items()), "CRUD labels drifted"
          for table, spec in modules.items():
              assert spec.get("table") == table, f"Table mismatch: {table}"
              assert set(spec.get("operations") or []) >= {"create", "update", "delete"}, f"CRUD contract missing: {table}"
          print(f"Canonical ZIP module contract validated: {len(panels)} panels / {len(modules)} modules")

          # Verify that every canonical module has a real Supabase backing table
          # and that every declared business field is present in the migration
          # contract. This prevents Android/Web from exposing decorative tables.
          import re
          migrations = ""
          for path in Path("supabase/migrations").glob("*.sql"):
              migrations += "\n" + path.read_text(encoding="utf-8")

          created = set(re.findall(
              r"create\s+table\s+(?:if\s+not\s+exists\s+)?public\.([a-zA-Z0-9_]+)",
              migrations,
              re.I,
          ))
          altered = {}
          for table, body in re.findall(
              r"alter\s+table\s+(?:if\s+exists\s+)?public\.([a-zA-Z0-9_]+)\s+([\s\S]*?);",
              migrations,
              re.I,
          ):
              altered.setdefault(table, set()).update(
                  re.findall(r"add\s+column\s+(?:if\s+not\s+exists\s+)?([a-zA-Z0-9_]+)", body, re.I)
              )

          def split_sql_columns(body):
              parts, current, depth, quote = [], [], 0, False
              for ch in body:
                  if ch == "'" and (not current or current[-1] != "\\"):
                      quote = not quote
                  if not quote:
                      if ch == "(":
                          depth += 1
                      elif ch == ")":
                          depth -= 1
                      elif ch == "," and depth == 0:
                          parts.append("".join(current))
                          current = []
                          continue
                  current.append(ch)
              if current:
                  parts.append("".join(current))
              return parts

          columns = {}
          for table, body in re.findall(
              r"create\s+table\s+(?:if\s+not\s+exists\s+)?public\.([a-zA-Z0-9_]+)\s*\(([\s\S]*?)\n\);",
              migrations,
              re.I,
          ):
              columns.setdefault(table, set())
              for part in split_sql_columns(body):
                  match = re.match(r"\s*([a-zA-Z_][a-zA-Z0-9_]*)\s+", part)
                  if match:
                      columns[table].add(match.group(1))
          for table, names in altered.items():
              columns.setdefault(table, set()).update(names)

          missing_tables = [table for table, spec in modules.items() if spec.get("table", table) not in created]
          missing_fields = {}
          for module, spec in modules.items():
              table = spec.get("table", module)
              have = columns.get(table, set())
              missing = [
                  field for field in (spec.get("fields") or [])
                  if field not in have and field not in {"id", "created_at", "updated_at", "deleted_at"}
              ]
              if missing:
                  missing_fields[table] = missing

          assert not missing_tables, f"Canonical modules without real DB tables: {missing_tables}"
          assert not missing_fields, f"Canonical module fields missing from migrations: {missing_fields}"
          print("Canonical module-to-database contract validated.")
          PY
          grep -Fq "version = 1.6.1" buildozer.spec
          grep -Fq "android.numeric_version = 161" buildozer.spec
          grep -Fq "package.name = frahooshmobile" buildozer.spec
          grep -Fq "package.domain = ir.frahoosh" buildozer.spec
          grep -Fq "source.dir = ." buildozer.spec
          grep -Fq "python-bidi==0.4.2" buildozer.spec
          echo "Repository validation passed."

      - name: Clean stale Buildozer state
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .buildozer bin
          rm -f mobile/runtime_config.json
          echo "Clean state prepared."

      - name: Recreate runtime config after clean
        shell: bash
        env:
          FRAHOOSH_SUPABASE_URL: ${{ secrets.FRAHOOSH_SUPABASE_URL }}
          FRAHOOSH_SUPABASE_ANON_KEY: ${{ secrets.FRAHOOSH_SUPABASE_ANON_KEY }}
          FRAHOOSH_SCHOOL_ID: ${{ secrets.FRAHOOSH_SCHOOL_ID }}
          FRAHOOSH_SCHOOL_NAME: ${{ secrets.FRAHOOSH_SCHOOL_NAME }}
          FRAHOOSH_SCHOOL_YEAR: ${{ secrets.FRAHOOSH_SCHOOL_YEAR }}
          FRAHOOSH_PAYMENT_GATEWAY_URL: ${{ secrets.FRAHOOSH_PAYMENT_GATEWAY_URL }}
          FRAHOOSH_WEB_URL: ${{ secrets.FRAHOOSH_WEB_URL }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          config = {
              "supabase_url": os.environ["FRAHOOSH_SUPABASE_URL"],
              "supabase_anon_key": os.environ["FRAHOOSH_SUPABASE_ANON_KEY"],
              "school_id": os.environ.get("FRAHOOSH_SCHOOL_ID", ""),
              "school_name": os.environ.get("FRAHOOSH_SCHOOL_NAME", "") or "دبیرستان سردارشهیدحاجی زاده ۲",
              "school_year": os.environ.get("FRAHOOSH_SCHOOL_YEAR", "") or "۱۴۰۵-۱۴۰۶",
              "payment_gateway_url": os.environ.get("FRAHOOSH_PAYMENT_GATEWAY_URL", ""),
              "web_url": os.environ.get("FRAHOOSH_WEB_URL", "") or "https://frahoosh.ir",
          }
          Path("mobile/runtime_config.json").write_text(
              json.dumps(config, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )
          PY
          test -s mobile/runtime_config.json

      - name: Bridge legacy Buildozer SDK path
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT}"
          mkdir -p "${SDK}/tools/bin"
          ln -sf "${SDK}/cmdline-tools/latest/bin/sdkmanager" "${SDK}/tools/bin/sdkmanager"
          test -x "${SDK}/tools/bin/sdkmanager"
          echo "Legacy Buildozer sdkmanager bridge ready: ${SDK}/tools/bin/sdkmanager"

      - name: Build APK
        shell: bash
        env:
          P4A_BUILD_ARGS: "--color=always"
        run: |
          set -euo pipefail
          export ANDROID_NDK_HOME="${ANDROID_SDK_ROOT}/ndk/28.2.13676358"
          export ANDROID_NDK_ROOT="${ANDROID_SDK_ROOT}/ndk/28.2.13676358"
          buildozer -v android debug

      - name: Verify APK output
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(bin/*.apk)
          test "${#apks[@]}" -gt 0
          echo "APK produced:"
          printf '%s\n' "${apks[@]}"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Frahoosh-APK-v1.6.1
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 14
