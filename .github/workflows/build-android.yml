name: Frahoosh Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Frahoosh APK
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332

      - name: Setup Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38d
        with:
          python-version: "3.11"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y git zip unzip wget curl autoconf automake libtool pkg-config zlib1g-dev libffi-dev libssl-dev build-essential

      - name: Install Build tools
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip
          pip install "cython==0.29.36" "buildozer==1.5.0"
          buildozer --version

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euxo pipefail
          SDK="$ANDROID_SDK_ROOT"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" platform-tools
          "$SDKMANAGER" "platforms;android-35"
          "$SDKMANAGER" "build-tools;35.0.0"
          "$SDKMANAGER" "ndk;28.2.13676358"

      - name: Configure Android environment
        shell: bash
        run: |
          set -euxo pipefail
          NDK="$ANDROID_SDK_ROOT/ndk/28.2.13676358"
          test -d "$NDK"
          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

      - name: Create runtime config
        shell: bash
        env:
          FRAHOOSH_SUPABASE_URL: ${{ secrets.FRAHOOSH_SUPABASE_URL }}
          FRAHOOSH_SUPABASE_ANON_KEY: ${{ secrets.FRAHOOSH_SUPABASE_ANON_KEY }}
          FRAHOOSH_SCHOOL_ID: ${{ secrets.FRAHOOSH_SCHOOL_ID }}
          FRAHOOSH_SCHOOL_NAME: ${{ secrets.FRAHOOSH_SCHOOL_NAME }}
          FRAHOOSH_SCHOOL_YEAR: ${{ secrets.FRAHOOSH_SCHOOL_YEAR }}
          FRAHOOSH_PAYMENT_GATEWAY_URL: ${{ secrets.FRAHOOSH_PAYMENT_GATEWAY_URL }}
          FRAHOOSH_WEB_URL: ${{ secrets.FRAHOOSH_WEB_URL }}
        run: |
          set -euo pipefail
          test -n "$FRAHOOSH_SUPABASE_URL"
          test -n "$FRAHOOSH_SUPABASE_ANON_KEY"
          python - <<'PY'
          import json, os
          from pathlib import Path
          config={
              "supabase_url":os.environ["FRAHOOSH_SUPABASE_URL"],
              "supabase_anon_key":os.environ["FRAHOOSH_SUPABASE_ANON_KEY"],
              "school_id":os.environ.get("FRAHOOSH_SCHOOL_ID",""),
              "school_name":os.environ.get("FRAHOOSH_SCHOOL_NAME","") or "نام مدرسه",
              "school_year":os.environ.get("FRAHOOSH_SCHOOL_YEAR",""),
              "payment_gateway_url":os.environ.get("FRAHOOSH_PAYMENT_GATEWAY_URL",""),
              "web_url":os.environ.get("FRAHOOSH_WEB_URL","") or "https://frahoosh.ir"}
          Path("mobile/runtime_config.json").write_text(json.dumps(config,ensure_ascii=False,indent=2),encoding="utf-8")
          PY
          test -s mobile/runtime_config.json

      - name: Validate mobile Python sources
        shell: bash
        run: |
          set -euxo pipefail
          python -m compileall -q mobile main.py

      - name: Validate stable Android identity
        shell: bash
        run: |
          set -euxo pipefail
          grep -q '^package.name = frahooshmobile$' buildozer.spec
          grep -q '^package.domain = ir.frahoosh$' buildozer.spec
          grep -q '^android.numeric_version = 151$' buildozer.spec
          grep -q '^version = 1.5.1$' buildozer.spec

      - name: Configure optional release signing
        shell: bash
        env:
          FRAHOOSH_KEYSTORE_B64: ${{ secrets.FRAHOOSH_KEYSTORE_B64 }}
          FRAHOOSH_KEYSTORE_PASSWORD: ${{ secrets.FRAHOOSH_KEYSTORE_PASSWORD }}
          FRAHOOSH_KEY_ALIAS: ${{ secrets.FRAHOOSH_KEY_ALIAS }}
          FRAHOOSH_KEY_PASSWORD: ${{ secrets.FRAHOOSH_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${FRAHOOSH_KEYSTORE_B64:-}" ] && [ -n "${FRAHOOSH_KEYSTORE_PASSWORD:-}" ] && [ -n "${FRAHOOSH_KEY_ALIAS:-}" ] && [ -n "${FRAHOOSH_KEY_PASSWORD:-}" ]; then
            echo "$FRAHOOSH_KEYSTORE_B64" | base64 --decode > "$GITHUB_WORKSPACE/frahoosh-release.keystore"
            cat >> buildozer.spec <<EOF
          android.keystore = $GITHUB_WORKSPACE/frahoosh-release.keystore
          android.keyalias = $FRAHOOSH_KEY_ALIAS
          android.keystorepass = $FRAHOOSH_KEYSTORE_PASSWORD
          android.keypass = $FRAHOOSH_KEY_PASSWORD
          EOF
            echo "FRAHOOSH_SIGNING_MODE=release" >> "$GITHUB_ENV"
          else
            echo "FRAHOOSH_SIGNING_MODE=debug" >> "$GITHUB_ENV"
          fi

      - name: Build APK
        shell: bash
        run: |
          set -euxo pipefail
          export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/28.2.13676358"
          export ANDROID_NDK_ROOT="$ANDROID_SDK_ROOT/ndk/28.2.13676358"
          if [ "$FRAHOOSH_SIGNING_MODE" = "release" ]; then
            buildozer -v android release
          else
            buildozer -v android debug
          fi

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Frahoosh-APK-v1.5.1
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 14
