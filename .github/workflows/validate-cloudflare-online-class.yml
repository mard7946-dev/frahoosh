name: Validate Cloudflare Online Class Migration

on:
  push:
    branches:
      - cloudflare-online-class-migration
      - main
    paths:
      - "cloudflare/online-class/**"
      - ".github/workflows/validate-cloudflare-online-class.yml"
  pull_request:
    branches:
      - main
    paths:
      - "cloudflare/online-class/**"
      - ".github/workflows/validate-cloudflare-online-class.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Worker syntax and D1 schema
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Validate Worker JavaScript syntax
        run: node --check cloudflare/online-class/worker.js

      - name: Validate Wrangler configuration JSON
        run: python -c "import json,pathlib; json.loads(pathlib.Path('cloudflare/online-class/wrangler.jsonc').read_text()); print('Wrangler config JSON is valid')"

      - name: Smoke-test D1 schema
        run: python cloudflare/online-class/tests/schema_smoke.py
