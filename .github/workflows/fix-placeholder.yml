name: Fix Persian panel text

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix text
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/پس از اتصال صحیح Backend اطلاعات/پس از اتصال صحیح سامانه مرکزی اطلاعات/g' mobile/screens/module.py
          rm -f .github/workflows/fix-placeholder.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mobile/screens/module.py .github/workflows/fix-placeholder.yml
          git commit -m 'Remove remaining English backend placeholder from panel'
          git push origin HEAD:main
