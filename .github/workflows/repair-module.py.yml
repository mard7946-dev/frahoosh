name: Repair module screen

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore module screen and remove placeholder text
        shell: bash
        run: |
          set -euo pipefail
          git show 91fb06510556f14348f312d149403860abfed42c:mobile/screens/module.py > mobile/screens/module.py
          python - <<'PY'
          from pathlib import Path
          p = Path('mobile/screens/module.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace('در Backend ', 'در سامانه مرکزی ')
          s = s.replace('Backend در این Build', 'تنظیمات اتصال سامانه مرکزی در این نسخه')
          s = s.replace('اتصال به Backend آماده نیست.', 'اتصال به سامانه مرکزی آماده نیست.')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit repaired file and remove repair workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/repair-module.py.yml
          git add mobile/screens/module.py .github/workflows/repair-module.py.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Restore full module screen and fix Persian placeholder text'
          git push origin HEAD:main
