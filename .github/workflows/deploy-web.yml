name: Deploy Frahoosh Web

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "shared/module_catalog.json"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build site
        run: |
          rm -rf dist
          mkdir -p dist/shared dist/mobile/assets dist/online_class_apk
          cp -R web/. dist/
          cp shared/module_catalog.json dist/shared/module_catalog.json
          cp mobile/assets/online_class.html dist/mobile/assets/online_class.html
          cp online_class_apk/classroom_patch.js dist/online_class_apk/classroom_patch.js
          printf '%s\n' 'frahoosh.ir' > dist/CNAME
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
