name: Deploy Frahoosh Web

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "online_class_apk/app/src/main/assets/room_assets/online_class.html"
      - "online_class_apk/app/src/main/assets/room_assets/classroom_patch.js"
      - "mobile/assets/online_class.html"
      - "shared/module_catalog.json"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build site
        run: |
          rm -rf dist
          mkdir -p dist/shared dist/mobile/assets dist/online_class_apk/app/src/main/assets/room_assets
          cp -R web/. dist/
          cp shared/module_catalog.json dist/shared/module_catalog.json
          cp mobile/assets/online_class.html dist/mobile/assets/online_class.html
          cp online_class_apk/classroom_patch.js dist/online_class_apk/classroom_patch.js
          cp online_class_apk/app/src/main/assets/room_assets/online_class.html dist/online_class_apk/app/src/main/assets/room_assets/online_class.html
          cp online_class_apk/app/src/main/assets/room_assets/classroom_patch.js dist/online_class_apk/app/src/main/assets/room_assets/classroom_patch.js
          printf '%s\n' 'frahoosh.ir' > dist/CNAME
      - name: Verify online class pages
        run: |
          test -s dist/online-class/index.html
          test -s dist/online-class/room.html
          test -s dist/online_class_apk/app/src/main/assets/room_assets/online_class.html
          test -s dist/online_class_apk/app/src/main/assets/room_assets/classroom_patch.js
          test -s dist/mobile/assets/online_class.html
          test -s dist/online_class_apk/classroom_patch.js
          grep -Fq 'https://raw.githack.com/mard7946-dev/frahoosh/"+revision+"/' dist/online-class/room.html
          grep -Fq 'getText(base+"online_class_apk/app/src/main/assets/room_assets/online_class.html"' dist/online-class/room.html
          grep -Fq 'getText(base+"online_class_apk/app/src/main/assets/room_assets/classroom_patch.js"' dist/online-class/room.html
          test -s dist/index.html
          echo "Verified shared web/APK entry, room loader routes, classroom runtime assets, and main site entry."
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
